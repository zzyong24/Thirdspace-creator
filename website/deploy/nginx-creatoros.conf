# CreatorOS 产品官网 nginx 站点(T-168)—— 部署到腾讯云 152.136.151.58。
#
# 落点:/etc/nginx/conf.d/creatoros.conf(与现有 license.conf/aitongban 同级)。
# 站点根:/var/www/creatoros(deploy.sh 用 rsync 推静态文件到这)。
# 子域名:creatoros.aitongban.cloud —— 需先在 DNS 加一条 A 记录指向 152.136.151.58。
#
# 一处托管三件事(与 P3/updater 打通):
#   /                      → 产品官网(index.html)
#   /updates/latest.json   → Tauri updater 更新包索引(P6 release.mjs 产出上传到这)
#   /prompts/bundle.json   → P3 远程 prompt 包(prompt-bundle.mjs 签名后上传到这)
#   （客户端配 PROMPT_BUNDLE_URL=https://creatoros.aitongban.cloud/prompts/bundle.json）
#
# SSL:先上 80 端口跑通,再 `certbot --nginx -d creatoros.aitongban.cloud` 自动配 443 + 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name creatoros.aitongban.cloud;

    root /var/www/creatoros;
    index index.html;

    # 中文页面:强制 UTF-8(HTML 已有 <meta charset> 兜底,这里再从响应头声明,双保险防乱码)。
    charset utf-8;

    # 官网静态站(单页,直出 index.html)。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # P3 远程 prompt 包 + P6 updater 更新索引 —— 静态签名文件,长连接不需要,允许跨源 GET
    # (客户端 backend 拉取)。真文件由 deploy 脚本 / release.mjs / prompt-bundle.mjs 上传。
    location /updates/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    location /prompts/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # 静态资源缓存(官网自身的图片/字体若后续加)。
    location ~* \.(png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/creatoros.access.log;
    error_log  /var/log/nginx/creatoros.error.log;
}
