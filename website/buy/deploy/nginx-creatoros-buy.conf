server {
    listen 80;
    server_name buy.aitongban.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name buy.aitongban.cloud;

    ssl_certificate     /etc/nginx/ssl/aitongban.cloud.cer;
    ssl_certificate_key /etc/nginx/ssl/aitongban.cloud.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/creatoros-buy;
    charset utf-8;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = / {
        limit_except GET HEAD { deny all; }
        return 302 /creatoros/;
    }

    location = /creatoros {
        limit_except GET HEAD { deny all; }
        return 308 /creatoros/;
    }

    location = /moving {
        limit_except GET HEAD { deny all; }
        return 308 /moving/;
    }

    location = /creatoros/ {
        expires -1;
        limit_except GET HEAD { deny all; }
        try_files /creatoros/index.html =404;
    }

    location = /moving/ {
        expires -1;
        limit_except GET HEAD { deny all; }
        try_files /index.html =404;
    }

    location = /index.html {
        internal;
        expires -1;
        try_files $uri =404;
    }

    location = /products/creatoros.json {
        limit_except GET HEAD { deny all; }
        expires -1;
        try_files $uri =404;
    }

    location = /products/moving.json {
        limit_except GET HEAD { deny all; }
        expires -1;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ^~ /shots/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ^~ /products/moving/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location = /downloads/moving/Meicuo-Moving-1.0.0-mac-arm64.dmg {
        limit_except GET HEAD { deny all; }
        alias /var/www/creatoros-buy/downloads/moving/Meicuo-Moving-1.0.0-mac-arm64.dmg;
        default_type application/octet-stream;
        expires 7d;
    }

    location = /favicon.ico {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ^~ /api/store/creatoros/ {
        limit_req zone=perip burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8610;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/store/moving/ {
        limit_req zone=perip burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8610;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /robots.txt {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /sitemap.xml {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        limit_except GET HEAD { deny all; }
        return 404;
    }
}
