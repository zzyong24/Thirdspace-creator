[package]
name = "creatoros-workbench-test"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[dependencies]
libc = "0.2"
rand = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }
