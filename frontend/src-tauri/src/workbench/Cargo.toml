[package]
name = "creatoros-workbench-test"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[features]
workbench-browser = []

[dependencies]
libc = "0.2"
rand = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
