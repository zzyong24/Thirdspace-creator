[package]
name = "creatoros-desktop"
version = "0.1.0"
description = "CreatorOS 桌面壳(Tauri v2)—— T-147 P1 底座"
authors = ["CreatorOS"]
edition = "2021"
# Tauri 2 需要 Rust 1.77+;本机 1.94.1 满足。
rust-version = "1.77"

# main.rs 编译成同名可执行体;lib.rs 承载可复用的 run() 入口(Tauri 官方脚手架惯例,
# 便于将来接 mobile / 单测)。
[lib]
name = "creatoros_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# [T-372 L2] 构建期算 sidecar.tar.gz 的 SHA-256,经 cargo:rustc-env 注入
# `CREATOROS_SIDECAR_SHA256`,运行时校验入口完整性(改 JS 必须先动 Rust)。
sha2 = "0.10"

[dependencies]
# [T-365] macOS 进程组树杀(killpg):app 退出必须带走 sidecar 全家(node+Chrome+ffmpeg)。
libc = "0.2"
# tauri 核心:壳/窗口/生命周期。features 保持最小(默认已含 wry webview)。
tauri = { version = "2", features = [] }
# shell 插件:唯一用途 = spawn/kill Next standalone sidecar 二进制(externalBin)。
tauri-plugin-shell = "2"
# [T-241] opener 插件:外链(target=_blank / 素材 sourceUrl / 购买链接)转系统浏览器打开。
# webview 默认拒绝新窗口请求 → 无此插件所有外链点击被吞(用户真机实锤)。
tauri-plugin-opener = "2"
# T-147 P6 桌面加固 —— updater 插件(minisign/Ed25519 签名更新包,不需 Apple 证书)。
# 配 tauri.conf.json plugins.updater.{pubkey,endpoints} + bundle.createUpdaterArtifacts。
tauri-plugin-updater = "2"
# [T-180] process 插件:更新装好后 relaunch() 重启 app(前端 @tauri-apps/plugin-process 的 Rust 侧)。
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T-147 P2 本地加密 —— master key 存 OS keychain(macOS Keychain / Windows Credential
# Manager / Linux Secret Service),首启随机生成 32B、后续取出,base64 后经 env
# `CREATOROS_MASTER_KEY` 注入 sidecar(node 侧 AES-256-GCM 加解密 model key)。
# keyring v3 默认 features 已带各平台原生后端(apple-native / windows-native /
# linux-native-sync-persistent),无需额外 native 编译链。
keyring = "3"
base64 = "0.22"
rand = "0.8"
# T-147 P5 桌面激活授权 —— 机器指纹(machineId)多因子组合。
# machine-uid:取平台稳定机器标识(macOS IOPlatformUUID / Windows MachineGuid / Linux
#   /etc/machine-id);sha2:与本机持久 UUID 组合哈希成稳定短指纹,注入 sidecar env。
machine-uid = "0.5"
sha2 = "0.10"
# [T-372 L2] Rust 校验门纵切 —— 校验决策链迁壳层:
#   ed25519-dalek:服务端响应 Ed25519 验签(raw 32B 公钥内嵌;测试用固定 seed 生成签名密钥);
#   aes-gcm:`.license` 放行快照的 AES-256-GCM 加密(与 sidecar secret-crypto 同 enc:v1: 封包格式);
#   httpdate:X-License-Date(RFC1123)解析,做 >300s 偏移防重放判定;
#   reqwest:activate/status 在线校验 + 向 sidecar loopback 同步展示副本(rustls,与 updater 依赖树一致)。
ed25519-dalek = "2"
aes-gcm = "0.10"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# 发布体积:release 用 opt-level=s + LTO + strip(桌面壳求小)。
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
