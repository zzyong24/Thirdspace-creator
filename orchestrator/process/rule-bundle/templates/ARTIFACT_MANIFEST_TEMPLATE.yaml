# 阶段清单模板：由初始化器写入 orchestrator/ARTIFACT_MANIFEST.yaml。
# 本文件记录阶段与检查状态，BACKLOG.md 记录任务；各自维护事实，不互相替代。
# 状态与授权语义见 rules/orchestrator-state-machine.md。
# BUILD 的内部步骤属于任务，不能伪装成新增阶段。

project:
  name: "<project-name>"
  artifact_root: "<path>"
  current_stage: "1-plan"
  updated_at: "<date-or-run-id>"

stages:
  "1-plan":
    status: "not-started"
    artifacts:
      - path: "PRODUCT_SPEC.md"
        role: "product-source-of-truth"   # 章节化:FR/NFR + flow + domain model + IA + HARD 表
    depends_on: []
    gate: "01-product-gate"               # 沿用范围授权；维护模式稳定面变更才启用正式评审
    gate_status: "not-run"
    confirmation_required: true           # 产品范围需要实际授权；已有确认可复用
    invalidated_by: []
    notes: ""
  "2-contract":
    status: "not-started"
    artifacts:
      - path: "SERVICE_CONTRACT.md"
        role: "frontend-backend-contract" # 含逐 FR 数据链路可行性判定(feasible/HARD/cut)
    depends_on: ["1-plan"]
    gate: "15b-contract-completeness-gate" # 操作与数据可行性；范围必要性先用 03 检查
    gate_status: "not-run"
    confirmation_required: true           # 契约在已授权范围内；不代表自动授权无人值守
    invalidated_by: []
    notes: ""
  "3-design":
    status: "not-started"
    artifacts:
      - path: "UI_RULES.md"
        role: "canonical-design-system"
      - path: "PAGE_SPEC.md"
        role: "page-contracts-with-binding" # binding 表:控件→API-xxx/planned/static,No API no UI
    depends_on: ["2-contract"]
    gate: "06-page-spec-gate"             # + 05-ui-gate；S 类可由 DEC-000 编译为 PRODUCT_SPEC 内 compact IA/草图
    gate_status: "not-run"
    confirmation_required: false
    invalidated_by: []
    notes: ""
  "4-build":
    status: "not-started"
    artifacts:
      - path: "<code-paths>"
        role: "vertical-slice-implementation" # 切片循环:契约细化→TDD→接真→回显 e2e→片级走查
    depends_on: ["2-contract", "3-design"]
    gate: "consistency-gates"             # 跨片孤儿扫描;片级门 = 13-tdd + 10-frontend-validation
    gate_status: "not-run"
    confirmation_required: false          # 范围内持续实现；超出授权的新决定单独处理
    invalidated_by: []
    notes: ""
  "5-ship":
    status: "not-started"
    artifacts:
      - path: "INTEGRATION_REPORT.md"
        role: "integration-evidence"
      - path: "RELEASE_REVIEW.md"
        role: "release-readiness"
    depends_on: ["4-build"]
    gate: "14-integration-gate"           # 主线真机走查 + 销账 + 跨页词表
    gate_status: "not-run"
    confirmation_required: true           # 发布需要实际授权；已有具体授权不重复询问
    invalidated_by: []
    notes: ""

# 追踪启用时记录扫描器实际结果，不能在扫描失败时手填 pass。
consistency_gate:
  status: "not-run"   # pass | fail | not-run，来自实际追踪检查
  blocks: []          # 检查失败时阻塞的阶段，如 ["5-ship"]

stage_defaults:
  valid_statuses:
    - "not-started"
    - "draft"
    - "needs-user-confirmation"
    - "blocked"
    - "passed"
    - "compact"        # 仅 S / 3-design / DEC-000，不是风险接受
    - "accepted-risk"
    - "invalidated"
  transition_rule: "见 rules/orchestrator-state-machine.md"

open_items:
  - id: "OPEN-001"
    stage: "<stage-id>"
    type: "question | risk | missing-artifact | validation-finding"
    description: "<specific item>"
    owner: "<user | agent | team>"
    revisit_trigger: "<when to resolve>"
    status: "open"
