          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const publicStack=text=>text.split(/\r?\n/).filter(line=>/^\s*at\s|^[A-Za-z]*Error:|^(?:file:\/\/\/|[A-Za-z]:[\\/]|\/).*:\d+(?::\d+)?$/.test(line)).join('\n').slice(0,16384);
          function child(args){
            if(Date.now()>=deadline)return {status:null,errorCode:'DIAGNOSTIC_BUDGET_EXHAUSTED'};
            const r=spawnSync(process.execPath,args,{cwd:root,env,encoding:'utf8',timeout:deadline-Date.now(),maxBuffer:1024*1024});
            return {status:r.status,signal:r.signal,errorCode:r.error?.code??null,stdoutBytes:Buffer.byteLength(r.stdout??''),stdoutSHA256:sha(r.stdout??''),stderrBytes:Buffer.byteLength(r.stderr??''),stderrSHA256:sha(r.stderr??''),stderrStack:publicStack(r.stderr??''),stdout:r.stdout??''};
          }
          const report={controlCommit:process.env.CREATOROS_T247_INSTALLER_CONTROL_COMMIT,sidecarSource:process.env.CREATOROS_T247_SIDECAR_SOURCE_COMMIT,syntax:[]};
          for(const name of names){
            const relative='frontend/scripts/desktop/'+name;
            try{const bytes=fs.readFileSync(path.join(root,relative)),r=child(['--check',relative]);delete r.stdout;report.syntax.push({path:relative,bytes:bytes.length,sha256:sha(bytes),LF:bytes.toString().split('\n').length-1,CRLF:bytes.toString().split('\r\n').length-1,...r});}
            catch(e){report.syntax.push({path:relative,errorName:e.name,errorCode:e.code??null});}
          }
          const importCode="import {pathToFileURL} from 'node:url';import {existsSync} from 'node:fs';import {resolve} from 'node:path';try{if(process.argv[1]!=='t247-readonly-import-sentinel'||existsSync(resolve(process.argv[1]))||resolve(process.argv[1])===resolve(process.argv[2]))throw Error('DIAGNOSTIC_IMPORT_ARGV_GUARD');await import(pathToFileURL(process.argv[2]).href);console.log(JSON.stringify({status:'imported'}));}catch(e){console.log(JSON.stringify({status:'failed',name:e.name,code:e.code??null,stack:e.stack}));process.exitCode=1;}";
          const imported=child(['--input-type=module','-e',importCode,'--','t247-readonly-import-sentinel',path.join(root,'frontend/scripts/desktop/build-sidecar.mjs')]);
          try{imported.result=JSON.parse(imported.stdout);}catch{imported.result={status:'no-closed-import-result'};}delete imported.stdout;
          report.buildSidecarImport=imported;report.elapsedMs=Date.now()-started;
          const output=path.join(root,'frontend/src-tauri/target/t247-installer-import-diagnostics.json');
          fs.writeFileSync(output,JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          // T247_INSTALLER_IMPORT_DIAGNOSTIC_END
          NODE
          pnpm -C frontend exec vitest run scripts/desktop/windows-runtime-config.test.mjs --config "$RUNNER_TEMP/t247-installer-vitest.config.mjs" --reporter=default --reporter=json --outputFile.json=src-tauri/target/t247-installer-vitest-results.json

      - name: 读版本号
        if: inputs.windows_capsule_mode != 'prepare'
        id: version
        run: echo "version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 校验发布包领取关闭与反馈配置(T-635)
        if: ${{ (inputs.validate_installers == true) && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        env:
          GROWTH_ENTITLEMENT_API_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
          CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: "https://growth.aitongban.cloud"
        run: |
          node <<'NODE'
          const expected = {
            CREATOROS_OWNED_DEVICES_ENABLED: "1",
            CREATOROS_MODEL_BENEFITS_ENABLED: "1",
            GROWTH_ENTITLEMENT_API_ORIGIN: "https://growth.aitongban.cloud",
            CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0",
            CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1",
            NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1",
          };
          for (const [name, value] of Object.entries(expected)) {
            if (process.env[name] !== value) {
              throw new Error(`[T-635] ${name} 必须为 ${value}`);
            }
          }
          const raw = (process.env.CREATOROS_FEEDBACK_OFFICIAL_ORIGINS || "").trim();
          if (!raw) throw new Error("[T-575] CREATOROS_FEEDBACK_OFFICIAL_ORIGINS 未配置");
          for (const value of raw.split(",").map((item) => item.trim())) {
            const url = new URL(value);
            if (
              url.protocol !== "https:" ||
              url.username ||
              url.password ||
              url.port ||
              url.pathname !== "/" ||
              url.search ||
              url.hash
            ) {
              throw new Error(`[T-575] 非法 official origin: ${value}`);
            }
          }
          NODE

      - name: 打包(release.mjs 全链)
        if: inputs.windows_capsule_mode != 'prepare'
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CREATOROS_UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}
          # [T-635] 双端统一绑定 Growth CreatorOS 商品；渠道身份仍由激活码签名
          # channelRef 决定。必须在 package fail-fast 前显式注入，不能依赖启动环境。
          CREATOROS_LICENSE_PROJECT_KEY: "creatoros"
          # [T-451] verdict-token 签名密钥对(build.rs 编译期需要私钥;build-sidecar 期需要公钥
          #   烘焙进 sidecar/frontend/.next/server/verdict-verify-key.json)。两个 secret 需在
          #   仓库 Settings → Secrets and variables → Actions 配置(名字逐字对齐);缺任一 → 编译报
          #   env-var not set / build-sidecar 打 warn 且 verdict 门永远拒 sidecar spawn。
          #   生成:pnpm -C frontend node scripts/desktop/verdict-keygen.mjs。
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          # [T-538] Rust 编译期烘焙后只注入本机 sidecar；Web UI 不可读取。
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: "https://growth.aitongban.cloud"
          # [T-635] 领取保持关闭；反馈仍由受控 release 双门开启。
          GROWTH_ENTITLEMENT_API_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
          CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          # [T-679] CreatorOS 仅消费 Growth 签名配置；公钥是验签材料，不是模型 Key。
          CREATOROS_CLIENT_CONFIG_PULL_ENABLED: "1"
          CREATOROS_GROWTH_CLIENT_CONFIG_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64: ${{ secrets.CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64 }}
          CREATOROS_GROWTH_CONFIG_KEY_ID: ${{ vars.CREATOROS_GROWTH_CONFIG_KEY_ID }}
          CREATOROS_CREATOR_RELEASE_COMMIT: ${{ inputs.windows_capsule_mode == 'consume' && inputs.capsule_source_commit || github.sha }}
          # [T-452 后修] CI 打的是正式发布包,走 fat lto `release` profile(而非本地内测的
          #   release-fast)—— 后续 T-446/updater/收集产物 校验步骤全按 target/release/bundle 找。
          #   本地日常打包不设此 env,走 release-fast 快通道。
          CREATOROS_RELEASE: "1"
          # 上面已精确恢复或构建 clean runtime；package 只做混淆/字节码/Tauri，
          # 不再重复跑 Next build + 生产依赖闭包组装。
          CREATOROS_SKIP_SIDECAR_REBUILD: "1"
          CREATOROS_SIGNED_SIDECAR_CAPSULE_PATH: ${{ inputs.windows_capsule_mode == 'consume' && format('{0}/frontend/src-tauri/target/t247-capsule', github.workspace) || '' }}
          # [T-675] Windows 已由公共入口准备少文件闭包；package 保留正式保护链，但
          # 不得通过旧 bytecode 布局重新引入 node_modules。
          CREATOROS_PRODUCTION_CLOSURE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: node scripts/desktop/release.mjs

      - name: 收集用户安装包(T-492)
        if: inputs.windows_capsule_mode != 'prepare'
        run: |
          node frontend/scripts/desktop/collect-user-installers.mjs \
            "${{ matrix.updater_target }}" \
            frontend/src-tauri/target/release/bundle \
            dist-upload
          ls -la dist-upload/

      # 制品先交付；额外验收由显式开关单独选择，真实结果仍保留。
      - name: 上传已生成的安装包（额外验收不阻断）
        if: inputs.windows_capsule_mode != 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.updater_target }}
          path: dist-upload/
          if-no-files-found: error

      - name: 校验 Windows 安装包 tarball 化(T-454·反转 T-446,setup.exe 只带 sidecar.tar.gz)
        if: ${{ (inputs.validate_installers == true && runner.os == 'Windows') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        run: |
          setup=$(find frontend/src-tauri/target/release/bundle/nsis -type f -iname '*-setup.exe' -print -quit)
          if [ -z "$setup" ]; then
            echo "[T-454] 未找到 NSIS setup.exe" >&2
            exit 1
          fi
          listing="$RUNNER_TEMP/creatoros-nsis-files.txt"
          7z l "$setup" > "$listing"
          # [T-454] 反转 T-446 校验:必须携带 tar,不能带展开目录(否则 NSIS 慢到 90min timeout)
          if ! grep -Fq 'sidecar.tar.gz' "$listing"; then
            echo "[T-454] setup.exe 未包含 sidecar.tar.gz(NSIS 打包又会退化成 20 万小文件)" >&2
            exit 1
          fi
          if grep -Fq 'sidecar\frontend\server.js' "$listing" || grep -Fq 'sidecar/frontend/server.js' "$listing"; then
            echo "[T-454] setup.exe 仍误带展开 sidecar/,会让 NSIS 处理 20 万文件卡死" >&2
            exit 1
          fi
          setup_bytes=$(wc -c < "$setup" | tr -d '[:space:]')
          node tools/windows-closure-rat/runtime-diagnostics.mjs --setup "$setup"
          echo "[T-454] ✓ setup.exe 携带 sidecar.tar.gz,不含展开目录"
          echo "[T-675] ✓ setupBytes=$setup_bytes"

      - name: 校验 Chromium 已打进 sidecar(防 warn 静默跳过违反 T-284)
        if: ${{ (inputs.validate_installers == true) && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        run: |
          find frontend/src-tauri/sidecar \
            -path '*/browsers/chromium-*' -type d -print -quit | grep -q . \
            || { echo "::error::Chromium 未打进 sidecar——bundleChromiumBrowser 被静默跳过"; exit 1; }

      # [T-487 RAT-PKG-02] 真执行本轮 setup.exe，不拿 7z 清单冒充安装验收。
      # 安装到 RUNNER_TEMP（通常是 D:）证明：目录选择生效、POSTINSTALL hook 真执行、
      # current 指针/关键入口存在、成功后 tar 已删除。独立验收结果只进入报告。
      - name: 验证安装器子进程不继承 verdict 材料(T-247，合成)
        if: ${{ (inputs.validate_installers == true && runner.os == 'Windows') && inputs.windows_capsule_mode != 'prepare' }}
        shell: pwsh
        env:
          CREATOROS_VERDICT_SIGNING_KEY_B64: "t247-synthetic-seed-not-a-key"
          CREATOROS_VERDICT_PUBKEY_B64: "t247-synthetic-public-not-a-key"
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:CREATOROS_VERDICT_SIGNING_KEY_B64 -ErrorAction SilentlyContinue
          Remove-Item Env:CREATOROS_VERDICT_PUBKEY_B64 -ErrorAction SilentlyContinue
          $state = node -e 'process.stdout.write(JSON.stringify({hasSeed:Object.hasOwn(process.env,"CREATOROS_VERDICT_SIGNING_KEY_B64"),hasPublic:Object.hasOwn(process.env,"CREATOROS_VERDICT_PUBKEY_B64")}))'
          if ($LASTEXITCODE -ne 0) { throw "[T-247] 合成子进程环境检查失败" }
          $observed = $state | ConvertFrom-Json
          if ($observed.hasSeed -or $observed.hasPublic) {
            throw "[T-247] 安装器子进程仍会继承 verdict 材料"
          }
          Write-Host "[T-247] 合成 Node 子进程两项材料均不存在"

      - name: Windows 安装期 runtime 原生冒烟(T-487)
        id: t247_windows_runtime_install
        if: ${{ (inputs.validate_installers == true && runner.os == 'Windows') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:CREATOROS_VERDICT_SIGNING_KEY_B64 -ErrorAction SilentlyContinue
          Remove-Item Env:CREATOROS_VERDICT_PUBKEY_B64 -ErrorAction SilentlyContinue
          $setup = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { throw "[T-487] 未找到 NSIS setup.exe" }
          node tools/windows-closure-rat/runtime-diagnostics.mjs --setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "安装包容量检查输入无效" }

          $installDir = Join-Path $env:RUNNER_TEMP "CreatorOS 中文 RAT02 Space"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $installWatch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList @("/S", "/D=$installDir")
          $installWatch.Stop()
          if ($process.ExitCode -ne 0) {
            throw "[T-487] NSIS 静默安装失败(exit=$($process.ExitCode))"
          }

          $pointer = Join-Path $installDir "runtime-images/runtime-current.txt"
          if (-not (Test-Path $pointer -PathType Leaf)) {
            $diagnostic = Join-Path $installDir "creatoros-runtime-install-error.log"
            Write-Host "===== Windows runtime 安装目录 ====="
            Get-ChildItem $installDir -Force -ErrorAction SilentlyContinue |
              Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
            if (Test-Path $diagnostic -PathType Leaf) {
              Write-Host "===== Windows runtime 安装错误 ====="
              Get-Content $diagnostic -Raw
            } else {
              Write-Host "[T-487] 安装错误日志不存在，安装期入口可能未被执行"
            }
            throw "[T-487] 安装完成但缺 runtime-current.txt"
          }
          $runtimeId = (Get-Content $pointer -Raw).Trim()
          if ($runtimeId -notmatch '^[A-Za-z0-9._-]+$') {
            throw "[T-487] runtime-current.txt 非法:$runtimeId"
          }
          $server = Join-Path $installDir "runtime-images/$runtimeId/sidecar/frontend/server.js"
          if (-not (Test-Path $server -PathType Leaf)) {
            throw "[T-487] 安装期 runtime 缺 frontend/server.js"
          }
          $cliScript = Join-Path $installDir `
            "runtime-images/$runtimeId/sidecar/frontend/cli/creatoros.cjs"
          $cliNode = Join-Path $installDir `
            "runtime-images/$runtimeId/sidecar/cli/node.exe"
          if (-not (Test-Path $cliScript -PathType Leaf)) {
            throw "[T-847] 安装期 runtime 缺 frontend/cli/creatoros.cjs"
          }
          if (-not (Test-Path $cliNode -PathType Leaf)) {
            throw "[T-847] 安装期 runtime 缺 cli/node.exe"
          }
          # release启动签名门及主页后BLAKE3持续使用原归档；不可由测试补资源。
          $archiveEvidence = [ordered]@{}
          foreach ($resource in @("sidecar.tar.gz", "sidecar.tar.gz.sig")) {
            $installedResource = Get-Item (Join-Path $installDir $resource) -Force
            if ($installedResource.PSIsContainer -or ($installedResource.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "[T-487] 已安装签名资源不是普通文件:$resource"
            }
            $inputResource = Join-Path "frontend/src-tauri" $resource
            $inputHash = (Get-FileHash $inputResource -Algorithm SHA256).Hash
            $installedHash = (Get-FileHash $installedResource.FullName -Algorithm SHA256).Hash
            if ($installedHash -ne $inputHash) { throw "[T-487] 已安装签名资源字节不符:$resource" }
            if ($resource -eq "sidecar.tar.gz.sig" -and $installedResource.Length -ne 104) {
              throw "[T-487] 公签名必须104字节"
            }
            $archiveEvidence[$resource] = [ordered]@{ bytes = $installedResource.Length; sha256 = $installedHash.ToLowerInvariant() }
          }
          $runtime = Join-Path $installDir "runtime-images/$runtimeId/sidecar"
          $runtimeFiles = @(Get-ChildItem $runtime -Recurse -File)
          $nodeModules = @(Get-ChildItem $runtime -Recurse -Directory -Filter "node_modules")
          $links = @(
            Get-ChildItem $runtime -Recurse -Force |
              Where-Object { $_.LinkType -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }
          )
          node tools/windows-closure-rat/runtime-diagnostics.mjs --runtime-files $runtimeFiles.Count
          if ($LASTEXITCODE -ne 0) { throw "运行文件清单无效" }
          if ($nodeModules.Count -ne 0 -or $links.Count -ne 0) {
            throw "[T-675] 安装 runtime 结构违规:node_modules=$($nodeModules.Count), links=$($links.Count)"
          }
          $runtimeBytes = ($runtimeFiles | Measure-Object Length -Sum).Sum
          $evidence = [ordered]@{
            schemaVersion = 1
            setupBytes = $setup.Length
            installMilliseconds = $installWatch.ElapsedMilliseconds
            runtimeFiles = $runtimeFiles.Count
            runtimeBytes = $runtimeBytes
            nodeModulesDirectories = $nodeModules.Count
            linksOrReparsePoints = $links.Count
            retainedSignedResources = $archiveEvidence
          }
          $evidencePath = "tools/windows-closure-rat/out/official-package-results.json"
          $null = New-Item -ItemType Directory -Force -Path (Split-Path -Parent $evidencePath)
          $evidence | ConvertTo-Json -Depth 6 | Out-File $evidencePath -Encoding utf8
          Write-Host "[T-675] ✓ 原生安装期物化通过: $server"

      - name: Windows 已安装 runtime verdict 只读泄漏扫描(T-656)
        if: ${{ (inputs.validate_installers == true && runner.os == 'Windows') && inputs.windows_capsule_mode != 'prepare' && steps.t247_windows_runtime_install.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CREATOROS_VERDICT_SIGNING_KEY_B64 -or -not $env:CREATOROS_VERDICT_PUBKEY_B64) {
            throw "[T-656] 专用扫描缺少既有 verdict 材料"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "CreatorOS 中文 RAT02 Space"
          node frontend/scripts/desktop/verdict-artifact-hardening.mjs `
            --scan-installed-runtime $installDir
          if ($LASTEXITCODE -ne 0) { throw "[T-656] 已安装 runtime 泄漏扫描失败" }

      - name: 校验 updater 产物 + .sig 齐(SPEC §15 验收 9)
        if: ${{ (inputs.validate_installers == true) && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        run: |
          found=$(find frontend/src-tauri/target/release/bundle \
            -name "*.app.tar.gz" -o -name "*.msi.zip" -o -name "*.nsis.zip" -o -name "*setup*.exe.sig" -o -name "*.sig" | head -5)
          echo "$found"
          test -n "$found" || { echo "::error::未找到 updater 产物/.sig"; exit 1; }

      - name: macOS Developer ID、公证与 Gatekeeper 门(T-709)
        if: ${{ (inputs.validate_installers == true && runner.os == 'macOS') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          app="frontend/src-tauri/target/release/bundle/macos/CreatorOS.app"
          dmg="$(find frontend/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          manifest="frontend/src-tauri/target/release/bundle/creatoros-release-manifest.json"
          test -d "$app" || { echo "::error::[T-709] 未找到 CreatorOS.app"; exit 1; }
          test -n "$dmg" || { echo "::error::[T-709] 未找到 macOS DMG"; exit 1; }
          test -f "$manifest" || { echo "::error::[T-709] 缺 release manifest"; exit 1; }

          jq -e '
            .codesign.signed == true and
            .codesign.platform == "darwin" and
            .notarize.notarized == true and
            .notarize.platform == "darwin"
          ' "$manifest" >/dev/null || {
            echo "::error::[T-709] release manifest 未证明 macOS 已签名且已公证"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

          mountpoint="$RUNNER_TEMP/creatoros-notarized-dmg"
          rm -rf "$mountpoint"
          mkdir -p "$mountpoint"
          detach() {
            hdiutil detach "$mountpoint" -force >/dev/null 2>&1 || true
          }
          trap detach EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          # T-975: 运行归档可清 Finder 元数据，DMG 根目录的布局文件必须保留。
          # 引导缺失单独报告，不把仍可安全安装的应用判为不可用。
          if test -s "$mountpoint/.DS_Store" && test -L "$mountpoint/Applications" &&
             test -s "$mountpoint/.background/creatoros-install-background@2x.png"; then
            echo "[T-975] ✓ DMG 安装引导布局、背景与应用程序入口存在"
          else
            echo "::warning::[T-975] DMG 安装引导不完整；应用可安装，但不得声称引导验收通过"
          fi
          mounted_app="$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$mounted_app" || {
            echo "::error::[T-709] DMG 内没有应用"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          spctl -a -vv -t exec "$mounted_app"
          echo "[T-709] ✓ Developer ID、notary staple、Gatekeeper 与 DMG 内应用验收通过"

      # [T-705] macOS bsdtar 默认会把 xattr 编成隐藏的 `._*` AppleDouble 条目。
      # 普通 tar 列表会把它们还原成 xattr，导致检查误以为归档干净；Rust tar 在用户机
      # 解压时却会写成 server.app 内的真实文件，破坏签名并被 AMFI 以 SIGKILL 终止。
      # 工作流层再次按用户机语义回放，避免构建脚本门禁未来被绕过或回退。
      - name: macOS sidecar 可搬运归档与解压后签名门(T-705)
        if: ${{ (inputs.validate_installers == true && runner.os == 'macOS') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          tarball="frontend/src-tauri/sidecar.tar.gz"
          packaged="frontend/src-tauri/target/release/bundle/macos/CreatorOS.app/Contents/Resources/sidecar.tar.gz"
          test -f "$tarball" || { echo "::error::[T-705] 缺 sidecar.tar.gz"; exit 1; }
          test -f "$packaged" || { echo "::error::[T-705] .app 未携带 sidecar.tar.gz"; exit 1; }
          cmp "$tarball" "$packaged" || {
            echo "::error::[T-705] .app 携带的 sidecar.tar.gz 不是本轮产物"
            exit 1
          }

          bad_entries="$(COPYFILE_DISABLE=1 tar -tzf "$tarball" \
            | grep -E '(^|/)\._|(^|/)\.DS_Store$' || true)"
          if [ -n "$bad_entries" ]; then
            echo "$bad_entries"
            echo "::error::[T-705] sidecar.tar.gz 含 AppleDouble/Finder 元数据"
            exit 1
          fi

          replay="$RUNNER_TEMP/creatoros-sidecar-tar-replay"
          rm -rf "$replay"
          mkdir -p "$replay"
          COPYFILE_DISABLE=1 tar -xzf "$tarball" -C "$replay" ./server.app
          codesign --verify --deep --strict --verbose=2 "$replay/server.app"
          if find "$replay" \( -name '._*' -o -name '.DS_Store' \) -print -quit | grep -q .; then
            echo "::error::[T-705] 用户机语义解压后仍出现 AppleDouble/Finder 元数据"
            exit 1
          fi
          echo "[T-705] ✓ 归档零 AppleDouble；解压后的 server.app 严格签名有效"

      - name: macOS 真启动与主页面加载冒烟(T-663)
        if: ${{ (inputs.validate_installers == true && runner.os == 'macOS') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          app="frontend/src-tauri/target/release/bundle/macos/CreatorOS.app"
          test -d "$app" || { echo "::error::[T-663] 未找到 CreatorOS.app"; exit 1; }
          stdout="$RUNNER_TEMP/creatoros-macos-startup.stdout.log"
          stderr="$RUNNER_TEMP/creatoros-macos-startup.stderr.log"
          : > "$stdout"
          : > "$stderr"

          # hosted runner 虽然通常是空机，仍显式清掉本任务 app 的 runtime，保证下面
          # 验证的是本轮 sidecar.tar.gz 的首次解压，不会误用同一 job 遗留的旧 runtime。
          runtime_root="$HOME/Library/Application Support/cloud.aitongban.creatoros/runtime"
          rm -rf "$runtime_root"

          cleanup() {
            osascript -e 'tell application id "cloud.aitongban.creatoros" to quit' >/dev/null 2>&1 || true
            sleep 2
            pkill -f "$app/Contents/MacOS/CreatorOS" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          open -n --stdout "$stdout" --stderr "$stderr" "$app"
          ready=0
          for _ in $(seq 1 3000); do
            if grep -Eq '\[CreatorOS\] MAIN_PAGE_LOAD_FINISHED http://127\.0\.0\.1:' "$stderr"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            echo "===== CreatorOS stdout ====="
            cat "$stdout" || true
            echo "===== CreatorOS stderr ====="
            cat "$stderr" || true
            echo "::error::[T-663] macOS CreatorOS 600 秒内未完成 sidecar 启动与主页面加载"
            exit 1
          fi
          extracted_app="$(find "$runtime_root" -path '*/sidecar/server.app' -type d -print -quit)"
          test -n "$extracted_app" || {
            echo "::error::[T-705] 真启动后未找到解压的 server.app"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$extracted_app"
          if find "$runtime_root" \( -name '._*' -o -name '.DS_Store' \) -print -quit | grep -q .; then
            echo "::error::[T-705] 真启动解压目录出现 AppleDouble/Finder 元数据"
            exit 1
          fi
          echo "[T-663] ✓ macOS CreatorOS 真启动并完成主页面加载"

      - name: 上传 T-635 产品身份与 release attestation（非发布产物）
        if: inputs.windows_capsule_mode != 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: t635-product-identity-${{ matrix.updater_target }}-${{ github.run_attempt }}
          path: |
            frontend/src-tauri/target/release/bundle/creatoros-product-manifest.json
            frontend/src-tauri/target/release/bundle/creatoros-release-attestation.json
            frontend/src-tauri/target/release/bundle/creatoros-release-manifest.json
          if-no-files-found: warn
          retention-days: 30

      # [T-562] 之前只执行 setup.exe 的安装期特殊入口，完全没有运行用户真正点击的
      # CreatorOS.exe，因此 sidecar cwd/verdict 公钥/WebView 导航回归都能带病上传。
      # Windows 安装、首启与主动卸载为独立可选验收，结果不影响已生成的制品。
      - name: Windows 安装后真启动与主页面加载冒烟(T-562)
        if: ${{ (inputs.validate_installers == true && runner.os == 'Windows') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "CreatorOS 中文 RAT02 Space"
          $appExe = Join-Path $installDir "CreatorOS.exe"
          if (-not (Test-Path $appExe -PathType Leaf)) {
            throw "[T-562] 安装完成但缺 CreatorOS.exe"
          }
          # T-826：真实用户升级机已有旧版 appData runtime；过去只测干净 runner，
          # 导致新安装 runtime 与旧 appData runtime 并存时启动前误丢当前版本。
          $appDataRuntime = Join-Path $env:APPDATA "cloud.aitongban.creatoros/runtime-images"
          Remove-Item -Recurse -Force $appDataRuntime -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $appDataRuntime | Out-Null
          Set-Content (Join-Path $appDataRuntime "runtime-current.txt") `
            "creatoros-stale-runtime-for-upgrade"

          $stdout = Join-Path $env:RUNNER_TEMP "creatoros-startup.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "creatoros-startup.stderr.log"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $launchWatch = [Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process -FilePath $appExe -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          try {
            for ($i = 0; $i -lt 600; $i++) {
              if (Test-Path $stderr) {
                $content = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
                if ($content -match '\[CreatorOS\] MAIN_PAGE_LOAD_FINISHED http://127\.0\.0\.1:') {
                  $ready = $true
                  break
                }
              }
              if ($app.HasExited) {
                break
              }
              Start-Sleep -Milliseconds 200
            }
            $launchWatch.Stop()
            if (-not $ready) {
              Write-Host "===== CreatorOS stdout ====="
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "===== CreatorOS stderr ====="
              if (Test-Path $stderr) { Get-Content $stderr }
              if ($app.HasExited) {
                throw "[T-562] CreatorOS 在主页面加载前退出(exit=$($app.ExitCode))"
              }
              throw "[T-562] CreatorOS 120 秒内未完成 sidecar 启动与 WebView 主页面加载"
            }
            if ($launchWatch.Elapsed.TotalSeconds -gt 45) {
              Write-Warning "[T-775] Windows 首次启动超过 45 秒（继续发布验证，120 秒真实主页加载仍为硬门）:$($launchWatch.Elapsed)"
            }
            $migratedPointer = Join-Path $appDataRuntime "runtime-current.txt"
            if (-not (Test-Path $migratedPointer -PathType Leaf)) {
              throw "[T-826] 升级机旧 runtime 未被当前安装 runtime 替换"
            }
            $migratedRuntimeId = (Get-Content $migratedPointer -Raw).Trim()
            if ($migratedRuntimeId -eq "creatoros-stale-runtime-for-upgrade") {
              throw "[T-826] runtime-current.txt 仍指向旧 runtime"
            }
            $migratedServer = Join-Path `
              $appDataRuntime "$migratedRuntimeId/sidecar/frontend/server.js"
            if (-not (Test-Path $migratedServer -PathType Leaf)) {
              throw "[T-826] 升级机迁移后的当前 runtime 缺 frontend/server.js"
            }
            $migratedCliScript = Join-Path `
              $appDataRuntime "$migratedRuntimeId/sidecar/frontend/cli/creatoros.cjs"
            $migratedCliNode = Join-Path `
              $appDataRuntime "$migratedRuntimeId/sidecar/cli/node.exe"
            $cliLauncher = Join-Path $env:LOCALAPPDATA "CreatorOS/bin/creatoros.cmd"
            foreach ($requiredCliFile in @($migratedCliScript, $migratedCliNode, $cliLauncher)) {
              if (-not (Test-Path $requiredCliFile -PathType Leaf)) {
                throw "[T-847] CreatorOS CLI 随包文件未在首启后落地:$requiredCliFile"
              }
            }
            $cliHelpLines = @(& $cliLauncher --help 2>&1)
            $cliHelpExit = $LASTEXITCODE
            $cliHelp = $cliHelpLines -join "`n"
            if ($cliHelpExit -ne 0) {
              throw "[T-847] CreatorOS CLI --help 失败(exit=$cliHelpExit):$cliHelp"
            }
            try {
              $cliHelpPayload = $cliHelp | ConvertFrom-Json -ErrorAction Stop
            } catch {
              throw "[T-848] CreatorOS CLI --help 未返回合法 JSON:$cliHelp"
            }
            if (
              $cliHelpPayload.ok -ne $true -or
              [string]::IsNullOrWhiteSpace([string]$cliHelpPayload.usage) -or
              $cliHelpPayload.usage -notmatch '^creatoros '
            ) {
              throw "[T-848] CreatorOS CLI --help 返回契约不完整:$cliHelp"
            }
            Write-Host "[T-848] ✓ CreatorOS CLI --help 随包冒烟通过"
            Write-Host "[T-826] ✓ 升级机旧 runtime 已被当前安装 runtime 替换"
            $evidencePath = "tools/windows-closure-rat/out/official-package-results.json"
            $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
            $evidence | Add-Member -NotePropertyName firstLaunchMilliseconds `
              -NotePropertyValue $launchWatch.ElapsedMilliseconds -Force
            $evidence | Add-Member -NotePropertyName mainPageLoadFinished `
              -NotePropertyValue $true -Force
            $evidence | Add-Member -NotePropertyName cliHelpVerified `
              -NotePropertyValue $true -Force
            $evidence | ConvertTo-Json | Out-File $evidencePath -Encoding utf8
            Write-Host "[T-675] ✓ 已安装 CreatorOS 真启动并完成主页面加载:$($launchWatch.Elapsed)"
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(120000)) {
                Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

      # 上传后可选择验主动卸载；真实失败只进入验收报告。
      - name: Windows 主动卸载清理冒烟(T-557)
        if: ${{ (inputs.validate_installers == true && runner.os == 'Windows') && inputs.windows_capsule_mode != 'prepare' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "CreatorOS 中文 RAT02 Space"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw "[T-557] 安装完成但缺官方 uninstall.exe"
          }
          $uninstall = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @("/S")
          if ($uninstall.ExitCode -ne 0) {
            throw "[T-557] NSIS 静默卸载失败(exit=$($uninstall.ExitCode))"
          }
          for ($i = 0; $i -lt 600 -and (Test-Path $installDir); $i++) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path (Join-Path $installDir "runtime-images")) {
            throw "[T-557] 主动卸载后仍残留 runtime-images"
          }
          if (Test-Path $installDir) {
            throw "[T-557] 主动卸载后仍残留安装目录:$installDir"
          }
          Write-Host "[T-557] ✓ 官方卸载器已清理 runtime 与安装目录"

      - name: 上传 T-675 Windows production closure 正式证据
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: t675-windows-production-closure-${{ github.run_attempt }}
          path: |
            tools/windows-closure-rat/out/closure/layer-summary.json
            tools/windows-closure-rat/out/closure/ncc-core-summary.json
            tools/windows-closure-rat/out/closure/runtime-smoke-results.json
            tools/windows-closure-rat/out/packaged-runtime-summary.json
            tools/windows-closure-rat/out/runtime-diagnostics.json
            tools/windows-closure-rat/out/asset-sources.json
            tools/windows-closure-rat/out/build-timings.json
            frontend/src-tauri/target/runtime-reports/build-timings.package.json
            tools/windows-closure-rat/out/official-package-results.json
            frontend/src-tauri/target/t247-installer-control-materialization.json
            frontend/src-tauri/target/t247-installer-import-diagnostics.json
            frontend/src-tauri/target/t247-installer-vitest-results.json
            tools/windows-closure-rat/out/validation-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: 清理 macOS 一次性签名钥匙串(T-709)
        if: runner.os == 'macOS' && always()
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CI_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_CI_KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$APPLE_CI_KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/creatoros-developer-id.p12"
          echo "[T-709] ✓ 一次性签名钥匙串与证书文件已清理"

  windows-runtime-rat:
    if: ${{ inputs.t247_private_asset_relay != true && (github.event_name == 'workflow_dispatch' && inputs.windows_runtime_rat == true) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: T-565 原生 Windows Runtime/Burn RAT
        shell: pwsh
        run: ./tools/windows-runtime-rat/run.ps1

      - name: 上传 T-565 RAT 证据（非发布产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t565-windows-runtime-rat-${{ github.run_attempt }}
          path: output/windows-runtime-rat/**
          if-no-files-found: warn
          retention-days: 14

  windows-closure-rat:
    if: ${{ inputs.t247_private_asset_relay != true && (github.event_name == 'workflow_dispatch' && (inputs.windows_closure_rat == true || inputs.windows_package_rat == true)) }}
    runs-on: windows-latest
    env:
      CREATOROS_PACKAGE_BUILD_ONLY: ${{ inputs.windows_package_rat == true && '1' || '0' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 读候选版本号
        id: version
        run: echo "version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.windows_package_rat == true }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.windows_package_rat == true }}
        with:
          workspaces: frontend/src-tauri
          cache-on-failure: true

      # 只缓存编译中间态，最终运行文件、凭据和用户数据不进入此缓存。
      - name: 恢复 Windows Next 编译缓存
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-win-x64-node25.9.0-v1-${{ hashFiles('pnpm-lock.yaml', 'frontend/next.config.*', 'tools/windows-closure-rat/**', 'frontend/scripts/desktop/package-flavor.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-win-x64-node25.9.0-v1-${{ hashFiles('pnpm-lock.yaml', 'frontend/next.config.*', 'tools/windows-closure-rat/**', 'frontend/scripts/desktop/package-flavor.mjs') }}-

      - name: 缓存 Windows 媒体工具
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/creatoros/ffmpeg-static
          key: media-win-x64-${{ hashFiles('frontend/scripts/desktop/fetch-ffmpeg.mjs') }}


      - name: 安装锁定依赖与 Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm -C frontend exec playwright install chromium

      - name: 构建 Windows production closure（与正式发布共用入口）
        env:
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
        run: node tools/windows-closure-rat/build-production-closure.mjs ${{ inputs.windows_package_rat == true && '--build-only' || '' }}

      - name: 接入 Tauri production sidecar
        if: ${{ inputs.windows_package_rat == true }}
        env:
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
        run: |
          node tools/windows-closure-rat/prepare-packaged-runtime.mjs \
            tools/windows-closure-rat/out/closure

      - name: 构建真实 NSIS 候选包（不发布）
        if: ${{ inputs.windows_package_rat == true }}
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CREATOROS_LICENSE_PROJECT_KEY: "creatoros"
          CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: ${{ vars.CREATOROS_FEEDBACK_OFFICIAL_ORIGINS }}
          CREATOROS_CLIENT_CONFIG_PULL_ENABLED: "1"
          CREATOROS_GROWTH_CLIENT_CONFIG_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64: ${{ secrets.CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64 }}
          CREATOROS_GROWTH_CONFIG_KEY_ID: ${{ vars.CREATOROS_GROWTH_CONFIG_KEY_ID }}
          CREATOROS_SKIP_SIDECAR_REBUILD: "1"
        run: |
          node node_modules/@tauri-apps/cli/tauri.js build -- --profile release-fast

      - name: 上传已生成的 Windows 候选包
        if: ${{ success() && inputs.windows_package_rat == true }}
        uses: actions/upload-artifact@v4
        with:
          name: creatoros-windows-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: frontend/src-tauri/target/release-fast/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 生成 T-635 Windows 候选包产品身份与 release attestation
        if: ${{ inputs.windows_package_rat == true }}
        continue-on-error: true
        working-directory: frontend
        env:
          CREATOROS_CREATOR_RELEASE_COMMIT: ${{ github.sha }}
          CREATOROS_GROWTH_RELEASE_COMMIT: ${{ vars.CREATOROS_GROWTH_RELEASE_COMMIT }}
          CREATOROS_ACTIVITY_RELEASE_COMMIT: ${{ vars.CREATOROS_ACTIVITY_RELEASE_COMMIT }}
        run: node scripts/desktop/product-identity-attest.mjs release-fast

      - name: 真安装、断网首启与 WebView 非白屏验证
        if: ${{ inputs.windows_package_rat == true && inputs.validate_installers == true }}
        continue-on-error: true
        shell: pwsh
        env:
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem "frontend/src-tauri/target/release-fast/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { throw "[T-565] 未找到真实 NSIS setup.exe" }
          node tools/windows-closure-rat/runtime-diagnostics.mjs --setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "安装包容量检查输入无效" }

          $listing = Join-Path $env:RUNNER_TEMP "creatoros-package-listing.txt"
          & 7z l $setup.FullName | Out-File -Encoding utf8 $listing
          $listingText = Get-Content $listing -Raw
          if ($listingText -notmatch 'sidecar\.tar\.gz') {
            throw "[T-565] setup.exe 未携带 sidecar.tar.gz"
          }
          if ($listingText -match 'sidecar[\\/]frontend[\\/]server\.js') {
            throw "[T-565] NSIS 又直接枚举展开 runtime 小文件"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "CreatorOS 中文 T565 Package RAT"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $installWatch = [Diagnostics.Stopwatch]::StartNew()
          $install = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList @("/S", "/D=$installDir")
          $installWatch.Stop()
          if ($install.ExitCode -ne 0) {
            throw "[T-565] NSIS 静默安装失败(exit=$($install.ExitCode))"
          }

          $pointer = Join-Path $installDir "runtime-images/runtime-current.txt"
          if (-not (Test-Path $pointer -PathType Leaf)) {
            throw "[T-565] 安装没有完成 runtime 事务"
          }
          $runtimeId = (Get-Content $pointer -Raw).Trim()
          $runtime = Join-Path $installDir "runtime-images/$runtimeId/sidecar"
          if (Test-Path (Join-Path $installDir "sidecar.tar.gz")) {
            throw "[T-565] setup 完成后仍残留待首启解压的 sidecar.tar.gz"
          }
          $runtimeFiles = @(Get-ChildItem $runtime -Recurse -File)
          $nodeModules = @(Get-ChildItem $runtime -Recurse -Directory -Filter "node_modules")
          $links = @(
            Get-ChildItem $runtime -Recurse -Force |
              Where-Object { $_.LinkType -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }
          )
          node tools/windows-closure-rat/runtime-diagnostics.mjs --runtime-files $runtimeFiles.Count
          if ($LASTEXITCODE -ne 0) { throw "运行文件清单无效" }
          if ($nodeModules.Count -ne 0) {
            throw "[T-565] 安装 runtime 仍含 node_modules:$($nodeModules.Count)"
          }
          if ($links.Count -ne 0) {
            throw "[T-675] 安装 runtime 仍含链接/重解析点:$($links.Count)"
          }
          node frontend/scripts/desktop/verdict-artifact-hardening.mjs `
            --scan-installed-runtime $installDir
          Remove-Item Env:CREATOROS_VERDICT_SIGNING_KEY_B64 -ErrorAction SilentlyContinue
          Remove-Item Env:CREATOROS_VERDICT_PUBKEY_B64 -ErrorAction SilentlyContinue
          $runtimeBytes = ($runtimeFiles | Measure-Object Length -Sum).Sum

          $appExe = Join-Path $installDir "CreatorOS.exe"
          if (-not (Test-Path $appExe -PathType Leaf)) {
            throw "[T-565] 安装后缺 CreatorOS.exe"
          }
          $appDataRuntime = Join-Path $env:APPDATA "cloud.aitongban.creatoros/runtime-images"
          Remove-Item -Recurse -Force $appDataRuntime -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $appDataRuntime | Out-Null
          Set-Content (Join-Path $appDataRuntime "runtime-current.txt") `
            "creatoros-stale-runtime-for-upgrade"
          $firewallRules = @()
          $portProbe = [Net.Sockets.TcpListener]::new(
            [Net.IPAddress]::Loopback,
            0
          )
          $portProbe.Start()
          $devtoolsPort = ([Net.IPEndPoint]$portProbe.LocalEndpoint).Port
          $portProbe.Stop()
          $stdout = Join-Path $env:RUNNER_TEMP "creatoros-t565.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "creatoros-t565.stderr.log"
          $domReport = Join-Path $env:RUNNER_TEMP "creatoros-t565-webview.json"
          $webviewData = Join-Path $env:RUNNER_TEMP "creatoros-t565-webview-data"
          Remove-Item -Recurse -Force $webviewData -ErrorAction SilentlyContinue
          $webviewPolicy = "HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          $launchStarted = [DateTime]::UtcNow
          $app = $null
          try {
            $programs = @($appExe) + @(
              Get-ChildItem $installDir -Recurse -File -Filter "creatoros-server*.exe" |
                ForEach-Object FullName
            )
            $uniquePrograms = @($programs | Select-Object -Unique)
            foreach ($program in $uniquePrograms) {
              $ruleName = "CreatorOS-T565-$([guid]::NewGuid())"
              New-NetFirewallRule -DisplayName $ruleName -Direction Outbound `
                -Program $program -Action Block | Out-Null
              $firewallRules += $ruleName
            }

            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$devtoolsPort"
            $env:WEBVIEW2_USER_DATA_FOLDER = $webviewData
            New-Item -Path $webviewPolicy -Force | Out-Null
            New-ItemProperty -Path $webviewPolicy -Name "*" -PropertyType String `
              -Value "--remote-debugging-port=$devtoolsPort" -Force | Out-Null
            $launchWatch = [Diagnostics.Stopwatch]::StartNew()
            $app = Start-Process -FilePath $appExe -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $ready = $false
            for ($i = 0; $i -lt 600; $i++) {
              if (Test-Path $stderr) {
                $content = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
                if ($content -match '\[CreatorOS\] MAIN_PAGE_LOAD_FINISHED http://127\.0\.0\.1:') {
                  $ready = $true
                  break
                }
              }
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 200
            }
            $launchWatch.Stop()
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "[T-565] 断网首启 120 秒内未进入本地主页面"
            }
            if ($launchWatch.Elapsed.TotalSeconds -gt 45) {
              Write-Warning "[T-775] Windows 候选首次启动超过 45 秒（继续发布验证，120 秒真实主页加载仍为硬门）:$($launchWatch.Elapsed)"
            }
            $migratedPointer = Join-Path $appDataRuntime "runtime-current.txt"
            if (-not (Test-Path $migratedPointer -PathType Leaf)) {
              throw "[T-826] 升级机旧 runtime 未被当前安装 runtime 替换"
            }
            $migratedRuntimeId = (Get-Content $migratedPointer -Raw).Trim()
            if ($migratedRuntimeId -eq "creatoros-stale-runtime-for-upgrade") {
              throw "[T-826] runtime-current.txt 仍指向旧 runtime"
            }
            $migratedServer = Join-Path `
              $appDataRuntime "$migratedRuntimeId/sidecar/frontend/server.js"
            if (-not (Test-Path $migratedServer -PathType Leaf)) {
              throw "[T-826] 升级机迁移后的当前 runtime 缺 frontend/server.js"
            }
            $runtime = Join-Path $appDataRuntime "$migratedRuntimeId/sidecar"
            Write-Host "[T-826] ✓ 升级机旧 runtime 已被当前安装 runtime 替换"
            Write-Host (
              "[T-565] setupBytes=$($setup.Length) " +
              "installMs=$($installWatch.ElapsedMilliseconds) " +
              "launchMs=$($launchWatch.ElapsedMilliseconds) " +
              "runtimeFiles=$($runtimeFiles.Count) runtimeBytes=$runtimeBytes"
            )
            $changedRuntimeFiles = @(
              Get-ChildItem $runtime -Recurse -File |
                Where-Object LastWriteTimeUtc -gt $launchStarted
            )
            $afterFiles = @(Get-ChildItem $runtime -Recurse -File)
            $afterBytes = ($afterFiles | Measure-Object Length -Sum).Sum
            $changedRuntimeSample = @(
              $changedRuntimeFiles |
                Select-Object -First 20 |
                ForEach-Object { [IO.Path]::GetRelativePath($runtime, $_.FullName) }
            )
            $debugArgumentProcesses = @(
              Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
                Where-Object CommandLine -Match "--remote-debugging-port=$devtoolsPort"
            )
            $partialEvidence = [ordered]@{
              schemaVersion = 1
              setupBytes = $setup.Length
              installMilliseconds = $installWatch.ElapsedMilliseconds
              firstLaunchMilliseconds = $launchWatch.ElapsedMilliseconds
              runtimeFiles = $runtimeFiles.Count
              runtimeBytes = $runtimeBytes
              runtimeFilesAfterFirstLaunch = $afterFiles.Count
              runtimeBytesAfterFirstLaunch = $afterBytes
              nodeModulesDirectories = $nodeModules.Count
              runtimeFilesChangedOnFirstLaunch = $changedRuntimeFiles.Count
              runtimeFilesChangedSample = $changedRuntimeSample
              offlineFirewallPrograms = $uniquePrograms.Count
              mainPageLoadFinished = $true
              webviewDebugArgumentProcesses = $debugArgumentProcesses.Count
              webviewDomVerified = $false
            }
            $partialEvidence | ConvertTo-Json | Out-File `
              "tools/windows-closure-rat/out/package-rat-results.json" -Encoding utf8
            if (
              $afterFiles.Count -ne $runtimeFiles.Count -or
              $afterBytes -ne $runtimeBytes -or
              $changedRuntimeFiles.Count -ne 0
            ) {
              throw "[T-565] 首启修改了安装 runtime（疑似仍在解压/自修复）"
            }
            if ($debugArgumentProcesses.Count -eq 0) {
              throw "[T-565] WebView2 子进程未收到 remote-debugging-port"
            }
            node tools/windows-closure-rat/inspect-installed-webview.mjs `
              $devtoolsPort $domReport
            if ($LASTEXITCODE -ne 0) {
              throw "[T-565] WebView2 DOM 非白屏验证失败"
            }

            $evidence = [ordered]@{
              schemaVersion = 1
              setupBytes = $setup.Length
              installMilliseconds = $installWatch.ElapsedMilliseconds
              firstLaunchMilliseconds = $launchWatch.ElapsedMilliseconds
              runtimeFiles = $runtimeFiles.Count
              runtimeBytes = $runtimeBytes
              runtimeFilesAfterFirstLaunch = $afterFiles.Count
              runtimeBytesAfterFirstLaunch = $afterBytes
              nodeModulesDirectories = $nodeModules.Count
              runtimeFilesChangedOnFirstLaunch = $changedRuntimeFiles.Count
              runtimeFilesChangedSample = $changedRuntimeSample
              offlineFirewallPrograms = $uniquePrograms.Count
              mainPageLoadFinished = $true
              webviewDebugArgumentProcesses = $debugArgumentProcesses.Count
              webviewDomVerified = $true
            }
            $evidence | ConvertTo-Json | Out-File `
              "tools/windows-closure-rat/out/package-rat-results.json" -Encoding utf8
            Write-Host "[T-565] ✓ 真包安装/断网首启/非白屏通过"
            $evidence | ConvertTo-Json
          } finally {
            Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -ErrorAction SilentlyContinue
            Remove-Item Env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path $webviewPolicy -Name "*" -ErrorAction SilentlyContinue
            foreach ($ruleName in $firewallRules) {
              Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
            }
            if ($app -and -not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(120000)) {
                Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: 上传 T-565 closure RAT 证据（非发布产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t565-windows-closure-rat-${{ github.run_attempt }}
          path: |
            tools/windows-closure-rat/out/closure/layer-summary.json
            tools/windows-closure-rat/out/closure/ncc-core-summary.json
            tools/windows-closure-rat/out/closure/runtime-smoke-results.json
            tools/windows-closure-rat/out/packaged-runtime-summary.json
            tools/windows-closure-rat/out/runtime-diagnostics.json
            tools/windows-closure-rat/out/asset-sources.json
            tools/windows-closure-rat/out/build-timings.json
            frontend/src-tauri/target/runtime-reports/build-timings.package.json
            tools/windows-closure-rat/out/package-rat-results.json
            ${{ runner.temp }}/creatoros-t565-webview.json
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 T-635 Windows 候选包身份与 attestation（非发布产物）
        if: ${{ success() && inputs.windows_package_rat == true }}
        uses: actions/upload-artifact@v4
        with:
          name: t635-windows-product-identity-${{ github.run_attempt }}
          path: |
            frontend/src-tauri/target/release-fast/bundle/creatoros-product-manifest.json
            frontend/src-tauri/target/release-fast/bundle/creatoros-release-attestation.json
          if-no-files-found: warn
          retention-days: 30

  draft-release:
    needs: build
    if: ${{ inputs.t247_private_asset_relay != true && (startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: 建 draft Release 挂产物(仅 tag 触发;draft 等人工检查后 publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unexpected=$(find artifacts -type f ! -name '*.dmg' ! -name '*-setup.exe' -print)
          if [ -n "$unexpected" ]; then
            echo "::error::用户 Release 混入非安装包:$unexpected"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --notes "CreatorOS 用户安装包（macOS DMG / Windows setup.exe）"
          gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber


  t247-private-asset-relay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.t247_private_asset_relay == true }}
    runs-on: ubuntu-latest
    # 原脚本7200s串行预算 + 合成控制测试/checkout/上传审计与清理余量。
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/desktop-release.yml
            /tools/windows-closure-rat/private-draft-artifact-relay.py
            /tools/windows-closure-rat/private-draft-artifact-relay.test.py
            /tools/windows-closure-rat/private-draft-installer-relay.py
            /tools/windows-closure-rat/private-draft-installer-relay.test.py

      - name: 验证固定私有中转控制面（合成输入，不连网）
        run: |
          python3 -B tools/windows-closure-rat/private-draft-artifact-relay.test.py
          python3 -B tools/windows-closure-rat/private-draft-installer-relay.test.py

      - name: 固定原ZIP只读审计与唯一未发布draft中转
        id: relay
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_ONLY: ${{ inputs.only }}
          RELAY_VALIDATE: ${{ inputs.validate_installers }}
          RELAY_RAT_RUNTIME: ${{ inputs.windows_runtime_rat }}
          RELAY_RAT_CLOSURE: ${{ inputs.windows_closure_rat }}
          RELAY_RAT_PACKAGE: ${{ inputs.windows_package_rat }}
          RELAY_CAPSULE_MODE: ${{ inputs.windows_capsule_mode }}
          RELAY_SOURCE: ${{ inputs.capsule_source_commit }}
          RELAY_PREPARE_RUN: ${{ inputs.capsule_run_id }}
          RELAY_ARTIFACT: ${{ inputs.capsule_artifact_id }}
          RELAY_DIGEST: ${{ inputs.capsule_artifact_digest }}
          RELAY_MANIFEST: ${{ inputs.capsule_manifest_sha256 }}
          RELAY_SIGNATURE: ${{ inputs.capsule_signature_commit }}
        run: python3 -B tools/windows-closure-rat/private-draft-installer-relay.py

      - name: 保留小体积公开审计与精确中转ID（失败亦保）
        if: ${{ always() && steps.relay.outputs.report_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: t247-private-relay-audit-${{ github.run_id }}
          path: ${{ steps.relay.outputs.report_path }}
          if-no-files-found: error
          retention-days: 7
