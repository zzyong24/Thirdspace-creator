# T-372 W-ci:GitHub Actions 双端桌面打包(macOS aarch64 + Windows x86_64)。
#
# 复用本仓 release.mjs 产包链(sidecar→混淆→tauri build→真实签名/公证)。
# T-1063：额外类型、运行时、安装与启动验收显式选择，不阻断实际安装制品交付。
#
# 触发:手动 workflow_dispatch(内测节奏)或 push v* tag(自动建 draft Release 挂产物)。
# 签名现状(T-709):macOS 正式 job 强制 Developer ID 签名 + Apple 公证，缺凭据即失败；
# Windows 在接入 Authenticode 前仍如实标 unsigned。updater minisign 签名不可关，私钥只在
# repo secret TAURI_SIGNING_PRIVATE_KEY，不进入仓库、artifact 或日志。
# 偏离 SPEC §12 已论证:mac x86_64 不出——GitHub 托管 Intel runner 已退役,交叉编译
# 会产出错架构原生依赖(better-sqlite3 等);Intel Mac 内测覆盖列遗留。
#
# [T-396c/T-492] 分发模型已渠道化(SPEC 2026-07-18 channel-links §6):客户端 updater
# endpoint 已摘除,更新 = 「版本检查(activation-manager latest-version 端点)+ 跳渠道
# downloadUrl(飞书/网盘)」。release.mjs 仍在构建链内部生成并校验 updater 产物,但用户下载
# artifact / draft release 只上传可双击安装的 DMG 或 setup.exe,不再重复上传 updater 包、
# minisign 签名或 latest.json。
# **发布动作 = 手动传安装包到各渠道飞书/网盘 + activation-manager 后台更新
# latestVersion/releaseNotes 与各渠道 downloadUrl**(全流程见 docs/RELEASING.md)。
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      only:
        description: "测试发行平台（默认 macOS；Windows/双端必须手动显式选择；RAT job 不受此项影响）"
        required: false
        type: choice
        options: ["macos", "windows", "all"]
        default: "macos"
      validate_installers:
        description: "额外运行安装/启动/卸载与签名验收（默认关闭，失败报告不阻断制品上传）"
        required: false
        type: boolean
        default: false
      windows_runtime_rat:
        description: "仅运行 T-565 Windows Runtime/Burn 原生 RAT（不构建、不发布正式安装包）"
        required: false
        type: boolean
        default: false
      windows_closure_rat:
        description: "仅运行 T-565 Windows 少文件 production closure RAT（不发布安装包）"
        required: false
        type: boolean
        default: false
      windows_package_rat:
        description: "构建 T-565 Windows 少文件候选安装包（只上传artifact，不公开发布）"
        required: false
        type: boolean
        default: false
      t247_private_asset_relay:
        description: "仅固定未签ZIP的私有draft临时中转，不构建、不发布、不签名"
        required: false
        type: boolean
        default: false
      windows_capsule_mode:
        description: "T247 固定tar准备/已签消费；默认打包保持原流程"
        required: false
        type: choice
        options: ["none", "prepare", "consume"]
        default: "none"
      capsule_source_commit:
        description: "consume：已签tar的准确40位源码commit"
        type: string
        required: false
      capsule_run_id:
        description: "consume：固定成功prepare run ID"
        type: string
        required: false
      capsule_artifact_id:
        description: "consume：固定unsigned capsule artifact ID"
        type: string
        required: false
      capsule_artifact_digest:
        description: "consume：固定artifact SHA256（不带前缀）"
        type: string
        required: false
      capsule_manifest_sha256:
        description: "consume：真实capsule-manifest.json SHA256"
        type: string
        required: false
      capsule_signature_commit:
        description: "consume：仅公共104B签名/非秘密回执的准确commit"
        type: string
        required: false
  push:
    tags: ["v*"]

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 按 only input 算出要跑的端(job 级 if 不能引用 matrix 上下文,故用动态 matrix)。
  plan:
    if: ${{ inputs.t247_private_asset_relay != true && (github.event_name != 'workflow_dispatch' || (inputs.windows_runtime_rat != true && inputs.windows_closure_rat != true && inputs.windows_package_rat != true) || (inputs.windows_package_rat == true && inputs.only == 'macos')) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          all='[{"os":"macos-latest","updater_target":"darwin-aarch64"},{"os":"windows-latest","updater_target":"windows-x86_64"}]'
          if [ "$ONLY" = "all" ]; then
            echo "matrix=$all" >> "$GITHUB_OUTPUT"
          elif [ "$ONLY" = "windows" ]; then
            echo "matrix=$(echo "$all" | jq -c "[.[]|select(.os|contains(\"$ONLY\"))]")" >> "$GITHUB_OUTPUT"
          else
            # tag push 没有 workflow_dispatch input，也必须默认只发 macOS。
            echo "matrix=$(echo "$all" | jq -c '[.[]|select(.os|contains("macos"))]')" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: ${{ inputs.t247_private_asset_relay != true && (github.event_name != 'workflow_dispatch' || (inputs.windows_runtime_rat != true && inputs.windows_closure_rat != true && inputs.windows_package_rat != true) || (inputs.windows_package_rat == true && inputs.only == 'macos')) }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CREATOROS_PACKAGE_BUILD_ONLY: "1"
      CREATOROS_CREATOR_RELEASE_COMMIT: ${{ inputs.windows_capsule_mode == 'consume' && inputs.capsule_source_commit || github.sha }}
      # T247：同一e315运行源，两门贯穿Next/closure、sidecar及Rust；仅本任务分支artifact。
      CREATOROS_OWNED_DEVICES_ENABLED: "1"
      CREATOROS_MODEL_BENEFITS_ENABLED: "1"
      CREATOROS_GROWTH_RELEASE_COMMIT: "95cd62e891ee581faca46a14a31df9c0109ab59b"
      CREATOROS_ACTIVITY_RELEASE_COMMIT: "c4435524a8fb96a556ffc039c025732925255e58"
    defaults:
      run:
        shell: bash
    steps:
      # T247：仅临时Windows runner兼容既有深层证据路径，不删文件或改变运行源。
      - name: 开启 Windows Git 长路径支持
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          test "$(git config --global --get core.longpaths)" = "true"

      - name: 限定固定tar恢复输入(T-247)
        env:
          MODE: ${{ inputs.windows_capsule_mode }}
          ONLY: ${{ inputs.only }}
          VALIDATE: ${{ inputs.validate_installers }}
          RAT_RUNTIME: ${{ inputs.windows_runtime_rat }}
          RAT_CLOSURE: ${{ inputs.windows_closure_rat }}
          RAT_PACKAGE: ${{ inputs.windows_package_rat }}
          SOURCE: ${{ inputs.capsule_source_commit }}
          PREPARE_RUN: ${{ inputs.capsule_run_id }}
          ARTIFACT: ${{ inputs.capsule_artifact_id }}
          ARTIFACT_SHA: ${{ inputs.capsule_artifact_digest }}
          MANIFEST_SHA: ${{ inputs.capsule_manifest_sha256 }}
          SIGNATURE_COMMIT: ${{ inputs.capsule_signature_commit }}
        run: |
          if [ -n "$MODE" ] && [ "$MODE" != "none" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/codex/t247-windows-e315-build-20261017"
            test "$ONLY" = "windows" && test "$VALIDATE" = "true"
            test "$RAT_RUNTIME" != "true" && test "$RAT_CLOSURE" != "true" && test "$RAT_PACKAGE" != "true"
            test "$MODE" = "prepare" || test "$MODE" = "consume"
            if [ "$MODE" = "consume" ]; then
              node -e 'for(const k of ["SOURCE","SIGNATURE_COMMIT"])if(!/^[a-f0-9]{40}$/.test(process.env[k]||""))throw Error("invalid commit");for(const k of ["ARTIFACT_SHA","MANIFEST_SHA"])if(!/^[a-f0-9]{64}$/.test(process.env[k]||""))throw Error("invalid digest");for(const k of ["PREPARE_RUN","ARTIFACT"])if(!/^[1-9][0-9]{0,19}$/.test(process.env[k]||"")||!Number.isSafeInteger(Number(process.env[k])))throw Error("invalid ID");'
            fi
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.windows_capsule_mode == 'consume' && inputs.capsule_source_commit || github.sha }}

      - uses: pnpm/action-setup@v4 # 版本读根 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0" # engines: >=25 <26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.windows_capsule_mode != 'prepare'

      - uses: Swatinem/rust-cache@v2
        if: inputs.windows_capsule_mode != 'prepare' && !(runner.os == 'Windows' && inputs.windows_capsule_mode == 'consume')
        with:
          workspaces: frontend/src-tauri
          key: t247-e315-owned1-policy1

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 只缓存编译中间态，最终运行文件、凭据和用户数据不进入此缓存。
      - name: 恢复 Windows Next 编译缓存
        if: runner.os == 'Windows' && inputs.windows_capsule_mode != 'consume'
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-win-x64-node25.9.0-v2-owned1-policy1${{ inputs.windows_capsule_mode == 'prepare' && '-capsule-release-csp1' || '' }}-${{ hashFiles('pnpm-lock.yaml', 'frontend/next.config.*', 'tools/windows-closure-rat/**', 'frontend/scripts/desktop/package-flavor.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-win-x64-node25.9.0-v2-owned1-policy1${{ inputs.windows_capsule_mode == 'prepare' && '-capsule-release-csp1' || '' }}-${{ hashFiles('pnpm-lock.yaml', 'frontend/next.config.*', 'tools/windows-closure-rat/**', 'frontend/scripts/desktop/package-flavor.mjs') }}-

      - name: 缓存 Windows 媒体工具
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/creatoros/ffmpeg-static
          key: media-win-x64-${{ hashFiles('frontend/scripts/desktop/fetch-ffmpeg.mjs') }}


      # [T-709] 正式 macOS job 使用一次性钥匙串。P12 与 Apple app-specific password
      # 仅来自 GitHub Secrets；仓库和 artifact 只保留公开证书指纹与验收结果。
      - name: 导入 macOS Developer ID 与公证凭据(T-709)
        if: runner.os == 'macOS'
        id: mac-signing
        env:
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE_P12_B64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_APP_PASSWORD
            APPLE_TEAM_ID
            APPLE_SIGNING_IDENTITY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::[T-709] 缺少 GitHub Actions 凭据/变量：$name"
              exit 1
            fi
          done

          p12_path="$RUNNER_TEMP/creatoros-developer-id.p12"
          keychain_path="$RUNNER_TEMP/creatoros-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notary_profile="creatoros-ci-notary"
          success=0
          cleanup_on_failure() {
            rm -f "$p12_path"
            if [ "$success" != "1" ]; then
              security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_on_failure EXIT
          echo "::add-mask::$keychain_password"
          printf 'APPLE_CI_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"

          node -e '
            const { writeFileSync } = require("node:fs");
            const raw = Buffer.from(process.env.APPLE_CERTIFICATE_P12_B64 || "", "base64");
            if (raw.length === 0) throw new Error("[T-709] P12 base64 解码为空");
            writeFileSync(process.argv[1], raw, { mode: 0o600 });
          ' "$p12_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          rm -f "$p12_path"

          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY" >/dev/null || {
                echo "::error::[T-709] P12 中没有配置的 APPLE_SIGNING_IDENTITY"
                exit 1
              }
          certificate_fingerprint="$({
            security find-certificate \
              -c "$APPLE_SIGNING_IDENTITY" \
              -p "$keychain_path" \
              | openssl x509 -outform der \
              | shasum -a 256
          } | awk '{print $1}')"
          test -n "$certificate_fingerprint" || {
            echo "::error::[T-709] 无法计算 Developer ID 证书指纹"
            exit 1
          }

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$keychain_path"

          printf 'certificate_fingerprint=%s\n' "$certificate_fingerprint" >> "$GITHUB_OUTPUT"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          printf 'APPLE_NOTARY_KEYCHAIN_PROFILE=%s\n' "$notary_profile" >> "$GITHUB_ENV"
          printf 'APPLE_NOTARY_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          success=1
          echo "[T-709] ✓ Developer ID 已导入一次性钥匙串；公证 profile 已就绪"

      - name: 计算 Runtime Node/V8 与 verdict 公钥指纹(T-487)
        if: runner.os != 'Windows'
        id: runtime-inputs
        env:
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: "https://growth.aitongban.cloud"
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { appendFileSync } = require("node:fs");
          const publicKey = (process.env.CREATOROS_VERDICT_PUBKEY_B64 || "").trim();
          const raw = Buffer.from(publicKey, "base64");
          if (!publicKey || raw.length !== 32) {
            throw new Error("[T-487] CREATOROS_VERDICT_PUBKEY_B64 缺失或不是 32B Ed25519 公钥");
          }
          const runtime = [
            process.version,
            process.versions.v8,
            process.versions.modules,
          ].join("-");
          const fingerprint = runtime.replace(/[^A-Za-z0-9._-]/g, "_");
          const publicKeyDigest = createHash("sha256")
            .update(publicKey)
            .digest("hex")
            .slice(0, 20);
          const releaseConfig = JSON.stringify({
            growthOrigin: "https://growth.aitongban.cloud",
            entitlementClaimEnabled: "0",
            ownedDevicesEnabled: process.env.CREATOROS_OWNED_DEVICES_ENABLED,
            modelBenefitsEnabled: process.env.CREATOROS_MODEL_BENEFITS_ENABLED,
            productFeedbackSubmitEnabled: "1",
            feedbackOfficialOrigins:
              (process.env.CREATOROS_FEEDBACK_OFFICIAL_ORIGINS || "").trim(),
          });
          const configDigest = createHash("sha256")
            .update(releaseConfig)
            .digest("hex")
            .slice(0, 20);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `fingerprint=${fingerprint}\npubkey=${publicKeyDigest}\nconfig=${configDigest}\n`,
          );
          NODE

      # [T-487] Runtime Image 精确缓存。只允许 exact key 命中，不设 restore-keys：
      # 平台/架构/Node ABI/锁文件/源码任一变化都必须重建，不能拿相近旧包冒险。
      # 保存动作紧跟 clean build，早于混淆/字节码，避免 job 结束时把已变异 sidecar 写回缓存。
      - name: 恢复 clean Runtime Image(T-487)
        if: runner.os != 'Windows'
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            frontend/src-tauri/sidecar
            frontend/src-tauri/binaries
          key: creatoros-runtime-v3-${{ steps.runtime-inputs.outputs.fingerprint }}-${{ runner.os }}-${{ runner.arch }}-codesign-${{ steps.mac-signing.outputs.certificate_fingerprint }}-verdict-${{ steps.runtime-inputs.outputs.pubkey }}-config-${{ steps.runtime-inputs.outputs.config }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'frontend/package.json', 'frontend/src/**', 'frontend/public/**', 'ai-worker/**', 'backend/**', 'contract/**', 'frontend/next.config.ts', 'frontend/scripts/desktop/build-sidecar.mjs', 'frontend/scripts/desktop/fetch-ffmpeg.mjs', 'frontend/scripts/desktop/platform-paths.mjs') }}

      - name: 校验命中缓存的 Node/V8 ABI 与 verdict 公钥(T-487)
        if: runner.os != 'Windows'
        id: runtime-abi
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
          EXPECTED_RUNTIME_FINGERPRINT: ${{ steps.runtime-inputs.outputs.fingerprint }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync, readdirSync, rmSync } = require("node:fs");
          const { join } = require("node:path");
          const { spawnSync } = require("node:child_process");
          const output = (valid) =>
            appendFileSync(process.env.GITHUB_OUTPUT, `valid=${valid}\n`);
          if (process.env.CACHE_HIT !== "true") {
            output("false");
            process.exit(0);
          }
          const binaries = join("frontend", "src-tauri", "binaries");
          const sidecar = join("frontend", "src-tauri", "sidecar");
          const runtimeBinary = existsSync(binaries)
            ? readdirSync(binaries)
                .filter((name) => name.startsWith("creatoros-server-"))
                .map((name) => join(binaries, name))[0]
            : undefined;
          const bakedKeyPath = join(
            sidecar,
            "frontend",
            ".next",
            "server",
            "verdict-verify-key.json",
          );
          let actualFingerprint = "";
          let bakedKey = "";
          if (runtimeBinary) {
            const probe = spawnSync(
              runtimeBinary,
              [
                "-p",
                "[process.version,process.versions.v8,process.versions.modules].join('-').replace(/[^A-Za-z0-9._-]/g,'_')",
              ],
              { encoding: "utf8" },
            );
            if (probe.status === 0) actualFingerprint = probe.stdout.trim();
          }
          if (existsSync(bakedKeyPath)) {
            try {
              bakedKey = JSON.parse(readFileSync(bakedKeyPath, "utf8")).publicKeyB64 || "";
            } catch {}
          }
          const valid =
            actualFingerprint === process.env.EXPECTED_RUNTIME_FINGERPRINT &&
            bakedKey === (process.env.CREATOROS_VERDICT_PUBKEY_B64 || "").trim();
          if (!valid) {
            console.warn(
              `[T-487] 缓存指纹失配，强制重建(runtime=${actualFingerprint || "missing"})`,
            );
            rmSync(sidecar, { recursive: true, force: true });
            rmSync(binaries, { recursive: true, force: true });
          }
          output(String(valid));
          NODE

      - name: 安装 macOS host Playwright Chromium(T-749)
        if: runner.os != 'Windows'
        run: pnpm -C frontend exec playwright install chromium

      - name: 构建 clean Runtime Image(T-487,仅 cache miss)
        if: runner.os != 'Windows' && (steps.runtime-cache.outputs.cache-hit != 'true' || steps.runtime-abi.outputs.valid != 'true')
        env:
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          # [T-635] live program-gate GO 前所有可分发包固定关闭领取。
          GROWTH_ENTITLEMENT_API_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
          CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: "https://growth.aitongban.cloud"
          # 缓存只保存展开后的 clean runtime；最终变换完成后再唯一压一次 tar。
          CREATOROS_SKIP_TARBALL: "1"
        run: node frontend/scripts/desktop/build-sidecar.mjs

      - name: 保存 clean Runtime Image(T-487)
        # GitHub cache 不可覆盖：若命中内容损坏，本轮会重建后继续，但不假装能覆盖同 key。
        # 正常 exact miss 才保存；异常命中需从 Actions cache 管理页删除后由下一轮重建。
        if: runner.os != 'Windows' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            frontend/src-tauri/sidecar
            frontend/src-tauri/binaries
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      # [T-675] Windows 正式包与 7 月 26 日候选包复用同一个少文件 production
      # closure 入口。禁止再调用 full build-sidecar，把开发依赖树打回用户安装包。
      - name: 安装 Windows production closure 的 Chromium
        if: runner.os == 'Windows' && inputs.windows_capsule_mode != 'consume'
        run: pnpm -C frontend exec playwright install chromium

      - name: 验证 Windows Worker 依赖图与原生路径语义(T-247)
        if: runner.os == 'Windows'
        run: node --test tools/windows-closure-rat/worker-dependency-graph.test.mjs

      - name: 构建并接入 Windows production closure(T-675)
        if: runner.os == 'Windows' && inputs.windows_capsule_mode != 'consume'
        env:
          CREATOROS_MIGRATION_ASSET_GIT_VERIFY: "1"
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
