# 合并后main Windows构建：固定源main de8bc008ec44caf92dee5508b626c101e4d13a33；仅当前构建分支，根私钥留本机，不创建tag/Release或修改渠道。
name: desktop-release
run-name: main-windows-20261027 ${{ inputs.phase }} ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "先prepare，本机签署公开回执后再package"
        type: choice
        options: [prepare, package]
        default: prepare
        required: true
      source_commit:
        description: "package：准确源码40位SHA"
        type: string
      prepare_run_id:
        description: "package：成功prepare run ID"
        type: string
      prepare_artifact_id:
        description: "package：未签capsule artifact ID"
        type: string
      prepare_artifact_digest:
        description: "package：完整ZIP SHA256"
        type: string
      capsule_manifest_sha256:
        description: "package：manifest SHA256"
        type: string
      signature_commit:
        description: "package：当前公开签名提交SHA"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: t1404-windows-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      CREATOROS_PACKAGE_BUILD_ONLY: "1"
      CREATOROS_OWNED_DEVICES_ENABLED: "1"
      CREATOROS_MODEL_BENEFITS_ENABLED: "1"
      CREATOROS_LICENSE_PROJECT_KEY: creatoros
      CREATOROS_CREATOR_RELEASE_COMMIT: ${{ inputs.phase == 'package' && inputs.source_commit || github.sha }}
      CREATOROS_GROWTH_RELEASE_COMMIT: ${{ vars.CREATOROS_GROWTH_RELEASE_COMMIT }}
      CREATOROS_ACTIVITY_RELEASE_COMMIT: ${{ vars.CREATOROS_ACTIVITY_RELEASE_COMMIT }}
      CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
      CREATOROS_CLIENT_CONFIG_PULL_ENABLED: "1"
      CREATOROS_GROWTH_CLIENT_CONFIG_ORIGIN: https://growth.aitongban.cloud
      CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64: ${{ secrets.CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64 }}
      CREATOROS_GROWTH_CONFIG_KEY_ID: ${{ vars.CREATOROS_GROWTH_CONFIG_KEY_ID }}
      CREATOROS_SIDECAR_SIGNING_REQUIRED: "1"
      CREATOROS_MIGRATION_ASSET_GIT_VERIFY: "1"
      GROWTH_ENTITLEMENT_API_ORIGIN: https://growth.aitongban.cloud
      CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
      CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
      NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
      CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: https://growth.aitongban.cloud
    steps:
      - name: 限定来源与显式阶段
        env:
          PHASE: ${{ inputs.phase }}
          SOURCE: ${{ inputs.source_commit }}
          SIGNATURE: ${{ inputs.signature_commit }}
          RUN_ID: ${{ inputs.prepare_run_id }}
          ARTIFACT_ID: ${{ inputs.prepare_artifact_id }}
          ARTIFACT_SHA: ${{ inputs.prepare_artifact_digest }}
          MANIFEST_SHA: ${{ inputs.capsule_manifest_sha256 }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'zzyong24/Thirdspace-creator' -or $env:GITHUB_REF -cne 'refs/heads/codex/build-main-windows-20261027' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw '构建来源不符' }
          if ($env:PHASE -eq 'prepare') {
            foreach ($name in @('SOURCE','SIGNATURE','RUN_ID','ARTIFACT_ID','ARTIFACT_SHA','MANIFEST_SHA')) { if ([Environment]::GetEnvironmentVariable($name)) { throw 'prepare不接收旧产物' } }
          } elseif ($env:PHASE -eq 'package') {
            foreach ($name in @('SOURCE','SIGNATURE')) { if ([Environment]::GetEnvironmentVariable($name) -cnotmatch '^[a-f0-9]{40}$') { throw 'commit格式不符' } }
            foreach ($name in @('ARTIFACT_SHA','MANIFEST_SHA')) { if ([Environment]::GetEnvironmentVariable($name) -cnotmatch '^[a-f0-9]{64}$') { throw '摘要格式不符' } }
            foreach ($name in @('RUN_ID','ARTIFACT_ID')) { if ([Environment]::GetEnvironmentVariable($name) -cnotmatch '^[1-9][0-9]{0,19}$') { throw 'ID格式不符' } }
            if ($env:SIGNATURE -cne $env:GITHUB_SHA) { throw '仅允许当前精确公签提交' }
          } else { throw '未知阶段' }
      - name: 启用临时Windows runner Git长路径
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.phase == 'package' && inputs.source_commit || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 传输绑定与官方capsule负例回归
        run: node --test tools/windows-closure-rat/flow-package-binding.test.mjs tools/windows-closure-rat/signed-sidecar-capsule.test.mjs
      - name: 安装构建期Chromium
        if: inputs.phase == 'prepare'
        run: pnpm -C frontend exec playwright install chromium
      - name: 构建Windows production closure
        if: inputs.phase == 'prepare'
        run: node tools/windows-closure-rat/build-production-closure.mjs --prepare-package --build-only
      - name: 制作同源未签capsule（不可交付）
        if: inputs.phase == 'prepare'
        run: node tools/windows-closure-rat/signed-sidecar-capsule.mjs prepare frontend/src-tauri/target/flow-repair-capsule
      - name: 上传唯一未签capsule
        if: inputs.phase == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: t1404-unsigned-windows-capsule
          path: frontend/src-tauri/target/flow-repair-capsule/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.phase == 'package'
      - name: 绑定来源、下载、官方验签并采用同一capsule
        if: inputs.phase == 'package'
        env:
          GH_TOKEN: ${{ github.token }}
          CREATOROS_CAPSULE_RUN_ID: ${{ inputs.prepare_run_id }}
          CREATOROS_CAPSULE_ARTIFACT_ID: ${{ inputs.prepare_artifact_id }}
          CREATOROS_CAPSULE_ARTIFACT_DIGEST: ${{ inputs.prepare_artifact_digest }}
          CREATOROS_CAPSULE_MANIFEST_SHA256: ${{ inputs.capsule_manifest_sha256 }}
          CREATOROS_CAPSULE_SIGNATURE_COMMIT: ${{ inputs.signature_commit }}
        run: node tools/windows-closure-rat/flow-package-acquire.mjs
      - name: 用CI既有verdict密钥编译匹配壳和安装包
        if: inputs.phase == 'package'
        working-directory: frontend
        env:
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_SIGNED_SIDECAR_CAPSULE_PATH: ${{ github.workspace }}/frontend/src-tauri/target/flow-repair-capsule
          CREATOROS_SKIP_SIDECAR_REBUILD: "1"
          CREATOROS_PRODUCTION_CLOSURE: "1"
        run: node scripts/desktop/package.mjs
      - name: 实际产物verdict明文泄漏与公钥匹配扫描
        if: inputs.phase == 'package'
        env:
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
        run: |
          @'
          import { verifyPackagedVerdictHardening } from './frontend/scripts/desktop/verdict-artifact-hardening.mjs';
          await verifyPackagedVerdictHardening({shellPath:'frontend/src-tauri/target/release-fast/CreatorOS.exe',canonicalTarball:'frontend/src-tauri/sidecar.tar.gz',signingSeed:process.env.CREATOROS_VERDICT_SIGNING_KEY_B64,publicKeyB64:process.env.CREATOROS_VERDICT_PUBKEY_B64});
          console.log('[T-1404] 实际壳与tar的verdict明文扫描通过');
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw '产物密钥扫描未通过' }
      - name: 收集安装包与公开摘要
        if: inputs.phase == 'package'
        run: |
          $bundle = 'frontend/src-tauri/target/release-fast/bundle'
          $installers = @(Get-ChildItem -LiteralPath "$bundle/nsis" -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw '必须有一个本轮setup.exe' }
          New-Item -ItemType Directory -Path dist-upload | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination dist-upload
          $manifest = "$bundle/creatoros-release-manifest.json"
          if (Test-Path -LiteralPath $manifest) { Copy-Item -LiteralPath $manifest -Destination dist-upload }
          $entry = $installers[0]
          $signature = Get-AuthenticodeSignature -LiteralPath $entry.FullName
          @{sourceCommit=$env:CREATOROS_CREATOR_RELEASE_COMMIT;workflowCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;installer=$entry.Name;bytes=$entry.Length;sha256=(Get-FileHash -LiteralPath $entry.FullName -Algorithm SHA256).Hash.ToLowerInvariant();authenticodeStatus=[string]$signature.Status;validation='package-generated; native UI and commercial models require separate acceptance'} | ConvertTo-Json | Set-Content -LiteralPath dist-upload/package-receipt.json -Encoding utf8NoBOM
      - name: 上传本次Windows安装包
        if: inputs.phase == 'package'
        uses: actions/upload-artifact@v4
        with:
          name: t1404-windows-installer
          path: dist-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: 保留实际构建报告（无凭据与用户库）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1404-${{ inputs.phase }}-reports
          path: |
            tools/windows-closure-rat/out/build-timings.json
            tools/windows-closure-rat/out/validation-status.json
            tools/windows-closure-rat/out/packaged-runtime-summary.json
            frontend/src-tauri/target/runtime-reports/build-timings.package.json
            frontend/src-tauri/target/t1404-acquisition-receipt.json
          if-no-files-found: ignore
          retention-days: 7
