# [T-326 ENG-H01] main/PR 验证门禁 —— 此前唯一 workflow 是可写仓的 Autonomous Harness
# (harness.yml,固定 feat/service-contract,不跑任何校验),main 曾可在零门禁下演进。
# 本 workflow 补上:boundary 扫描 + lint + 全包 typecheck + 全包单测 + frontend 生产构建。
#
# Node 版本:setup-node 读 .nvmrc(=25),满足根 package.json engines ">=25 <26"。
# pnpm 版本:pnpm/action-setup@v4 自动读根 package.json 的 packageManager 字段(pnpm@10.32.1),
#           不在此处重复写死,升级只改一处。
# harness.yml 保持不动(职责不同:它是无人值守构建循环,本文件是验证门禁)。
name: Verify

on:
  push:
    branches: [main]
  pull_request:

# 只读门禁 —— 不需要也不该有写权限(与 harness.yml 的 contents:write 形成对照)。
permissions:
  contents: read

# 同一分支/PR 的新提交取消旧跑批,省 runner 时长。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查独立执行，避免其耗时挤占单测预算。
  checks:
    name: lint + typecheck + boundary
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 提高堆上限；类型检查串行，避免多个大堆争抢 runner 内存。
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本来自根 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      # Node 25(.nvmrc 单一真值;根 engines ">=25 <26")+ pnpm store 缓存。
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 安装依赖(锁定 lockfile)
        run: pnpm install --frozen-lockfile

      # 架构边界扫描(基线感知:只挡新增违规,存量 5 条在基线内)。
      - name: boundary 扫描
        run: pnpm boundary

      # lint 目前只有 frontend 配了 eslint;其余包暂无 lint script(有什么跑什么)。
      # [诚实标注] 存量 lint 债务 ~2461 errors(历史累积,BACKLOG 已立清理任务)——lint 先作
      # 非阻塞可见信号(continue-on-error),typecheck/test/build 才是硬门;债务清零后改回硬门。
      - name: lint(frontend eslint,非阻塞·存量债务清理中)
        run: pnpm --filter creatoros-frontend lint
        continue-on-error: true

      # 全包 tsc --noEmit(frontend 的 typecheck script 自带 next typegen 前置)。
      - name: typecheck(全 workspace)
        run: pnpm -r --workspace-concurrency=1 typecheck

      - name: 质量门工具自测(known-failures 判定逻辑)
        run: node --test tools/quality/quality.test.mjs

  # 每包独立 runner；大包通过 Vitest 原生分片覆盖完整套件。
  # fail-fast=false：某片失败仍执行其余片，所有原包与质量守卫保留。
  unit:
    name: 单测 ${{ matrix.package }} (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: contract, shard: "1/1", workers: 2 }
          - { package: backend, workers: 2, shard: "1/8" }
          - { package: backend, workers: 2, shard: "2/8" }
          - { package: backend, workers: 2, shard: "3/8" }
          - { package: backend, workers: 2, shard: "4/8" }
          - { package: backend, workers: 2, shard: "5/8" }
          - { package: backend, workers: 2, shard: "6/8" }
          - { package: backend, workers: 2, shard: "7/8" }
          - { package: backend, workers: 2, shard: "8/8" }
          - { package: ai-worker, shard: "1/1", workers: 2 }
          - { package: mcp-server, shard: "1/1", workers: 2 }
          - { package: frontend, workers: 2, shard: "1/4" }
          - { package: frontend, workers: 2, shard: "2/4" }
          - { package: frontend, workers: 2, shard: "3/4" }
          - { package: frontend, workers: 2, shard: "4/4" }
    env:
      # private ubuntu-latest 为 2 CPU / 8 GB；两个测试进程各限 3 GiB old-space。
      # 堆上限不是 RSS 上限，WASM/浏览器另占内存，实际峰值随证据上传。
      NODE_OPTIONS: --max-old-space-size=3072
      # 每包最多两个 worker；普通测试保持原内存 PGlite 语义，显式磁盘用例自管目录。
      # run-tests 同时隔离 HOME/CODEX_HOME，运行异常仍由 reporter 阻断。
      QUALITY_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史恢复回归会读取固定旧producer的真实Git对象，浅克隆不能完成原验收。
          fetch-depth: 0
      - name: 核验历史恢复的固定producer对象
        if: matrix.package == 'frontend'
        run: |
          historical_producer=6e4689b3180f91189110208267708ad72b03ae64
          git cat-file -e "$historical_producer^{commit}" || git fetch --no-tags origin "$historical_producer"
          git cat-file -e "$historical_producer^{commit}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: 安装依赖(锁定 lockfile)
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium(ai-worker/backend 浏览器测试)
        if: matrix.package == 'ai-worker' || matrix.package == 'backend'
        run: pnpm --filter @creatoros/ai-worker exec playwright install --with-deps chromium
      - name: 安装 Chromium(frontend 真实渲染测试)
        if: matrix.package == 'frontend'
        run: pnpm --filter creatoros-frontend exec playwright install --with-deps chromium
      - name: 安装并核验媒体工具
        if: matrix.package == 'backend' || matrix.package == 'frontend'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: 单测完整分片
        env:
          CREATOROS_TEST_OUTPUT_ROOT: ${{ runner.temp }}/creatoros-test-output
          T1324_RUNTIME_ROOT: ${{ runner.temp }}/creatoros-t1324-runtime
          TMPDIR: ${{ runner.temp }}/creatoros-test-tmp
        run: |
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/quality"
          free -m
          nproc
          /usr/bin/time -v -o "$RUNNER_TEMP/quality/resources.txt" node tools/quality/run-tests.mjs "${{ matrix.package }}" --shard "${{ matrix.shard }}" --max-workers "${{ matrix.workers }}" --log-dir "$RUNNER_TEMP/quality" --out "$RUNNER_TEMP/quality/${{ matrix.package }}.json"
      - name: 上传单测证据(含失败)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # job-index 避免 shard 中的斜杠及多 job 同名冲突。
          name: unit-test-evidence-${{ matrix.package }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/quality
          retention-days: 14

  # frontend 生产构建 —— 长通道,与 checks 并行。
  build:
    name: frontend 生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 安装依赖(锁定 lockfile)
        run: pnpm install --frozen-lockfile

      - name: build(next build)
        env:
          # [ENG-H02 隔离带] 当前 next build 仍会构造 persistence(seed/回填/cron 副作用),
          # 无 DATABASE_URL 时 db driver 默认落盘 ~/.creatoros/db —— 在 CI 里把它显式圈进
          # runner 临时目录,副作用不出沙箱。ENG-H02 根治(build 零 DB 副作用)后此变量仍无害,
          # 届时可作为双保险保留或移除。
          PGLITE_DATA_DIR: ${{ runner.temp }}/creatoros-pglite-build
        run: pnpm --filter creatoros-frontend build
