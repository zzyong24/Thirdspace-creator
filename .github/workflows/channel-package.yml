# T-753：N 渠道正式安装包工厂。渠道资料只从当前提交内的 PackageManifest/identity.lock 读取。
# 本 workflow 只上传 Actions artifact；不创建 tag/Release，不修改 CDN、Growth 或 Activity。
name: channel-package

on:
  workflow_dispatch:
    inputs:
      package_ref:
        description: "已提交的渠道 packageRef（例如 zhisu-ai）"
        required: true
        type: string
      only:
        description: "构建平台"
        required: false
        type: choice
        options: ["macos", "windows", "all"]
        default: "all"

permissions:
  contents: read

concurrency:
  group: channel-package-${{ github.ref }}-${{ inputs.package_ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm

      - name: 校验已提交渠道清单与不可变身份
        env:
          PACKAGE_REF: ${{ inputs.package_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_REF" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]]; then
            echo "::error::package_ref 格式非法"
            exit 1
          fi
          package_dir="frontend/branding/packages/${PACKAGE_REF}"
          manifest="frontend/branding/packages/${PACKAGE_REF}/package.json"
          git ls-files --error-unmatch "$manifest" "$package_dir/identity.lock.json" >/dev/null
          git diff --quiet HEAD -- "$package_dir"
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");
          const ref = process.env.PACKAGE_REF;
          const root = `frontend/branding/packages/${ref}`;
          const manifest = JSON.parse(readFileSync(`${root}/package.json`, "utf8"));
          for (const icon of Object.values(manifest.icons ?? {})) {
            const relative = `${root}/${icon.path}`;
            execFileSync("git", ["ls-files", "--error-unmatch", relative], { stdio: "ignore" });
          }
          NODE
          pnpm -C frontend desktop:package-channel -- \
            --manifest "branding/packages/${PACKAGE_REF}/package.json" \
            --target macos-aarch64 --mode release --plan-only
          pnpm -C frontend desktop:package-channel -- \
            --manifest "branding/packages/${PACKAGE_REF}/package.json" \
            --target windows-x86_64 --mode release --plan-only

      - id: matrix
        name: 生成平台矩阵
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          all='[{"os":"macos-latest","target":"macos-aarch64"},{"os":"windows-latest","target":"windows-x86_64"}]'
          case "$ONLY" in
            all) matrix="$all" ;;
            macos) matrix='[{"os":"macos-latest","target":"macos-aarch64"}]' ;;
            windows) matrix='[{"os":"windows-latest","target":"windows-x86_64"}]' ;;
            *) echo "::error::only 非法"; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_REF: ${{ inputs.package_ref }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - id: version
        name: 读取桌面版本
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const { version } = require("./frontend/src-tauri/tauri.conf.json");
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("桌面版本格式非法");
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: 校验渠道输入仍来自当前提交
        run: |
          set -euo pipefail
          package_dir="frontend/branding/packages/${PACKAGE_REF}"
          manifest="frontend/branding/packages/${PACKAGE_REF}/package.json"
          git ls-files --error-unmatch "$manifest" "$package_dir/identity.lock.json" >/dev/null
          git diff --quiet HEAD -- "$package_dir"
          pnpm -C frontend desktop:package-channel -- \
            --manifest "branding/packages/${PACKAGE_REF}/package.json" \
            --target "$TARGET" --mode release --plan-only

      - name: 校验正式构建公共凭据
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64: ${{ secrets.CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64 }}
          CREATOROS_GROWTH_CONFIG_KEY_ID: ${{ vars.CREATOROS_GROWTH_CONFIG_KEY_ID }}
        run: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
            CREATOROS_VERDICT_SIGNING_KEY_B64
            CREATOROS_VERDICT_PUBKEY_B64
            CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64
            CREATOROS_GROWTH_CONFIG_KEY_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 GitHub Actions 凭据/变量：$name"
              exit 1
            fi
          done

      - name: 导入 macOS Developer ID 与公证凭据
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE_P12_B64 APPLE_CERTIFICATE_PASSWORD APPLE_ID
            APPLE_APP_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 GitHub Actions 凭据/变量：$name"
              exit 1
            fi
          done
          p12_path="$RUNNER_TEMP/channel-developer-id.p12"
          keychain_path="$RUNNER_TEMP/channel-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notary_profile="channel-ci-notary"
          echo "::add-mask::$keychain_password"
          node -e '
            const { writeFileSync } = require("node:fs");
            const raw = Buffer.from(process.env.APPLE_CERTIFICATE_P12_B64 || "", "base64");
            if (!raw.length) throw new Error("P12 base64 解码为空");
            writeFileSync(process.argv[1], raw, { mode: 0o600 });
          ' "$p12_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security import "$p12_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          rm -f "$p12_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY" >/dev/null
          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain_path"
          {
            echo "APPLE_CI_KEYCHAIN_PATH=$keychain_path"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "APPLE_NOTARY_KEYCHAIN_PROFILE=$notary_profile"
            echo "APPLE_NOTARY_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: 安装构建期 Chromium
        run: pnpm -C frontend exec playwright install chromium

      - name: 准备 Windows 少文件 production closure
        if: runner.os == 'Windows'
        env:
          CREATOROS_PACKAGE_BRAND_INPUT_PATH: frontend/src-tauri/target/package-flavors/${{ inputs.package_ref }}/windows-x86_64/package-brand-build-input.json
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          GROWTH_ENTITLEMENT_API_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
          CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: "https://growth.aitongban.cloud"
        run: node tools/windows-closure-rat/build-production-closure.mjs --prepare-package

      - name: 构建渠道正式安装包
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CREATOROS_LICENSE_PROJECT_KEY: "creatoros"
          CREATOROS_VERDICT_SIGNING_KEY_B64: ${{ secrets.CREATOROS_VERDICT_SIGNING_KEY_B64 }}
          CREATOROS_VERDICT_PUBKEY_B64: ${{ secrets.CREATOROS_VERDICT_PUBKEY_B64 }}
          CREATOROS_FEEDBACK_OFFICIAL_ORIGINS: "https://growth.aitongban.cloud"
          GROWTH_ENTITLEMENT_API_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_ENTITLEMENT_CLAIM_ENABLED: "0"
          CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          NEXT_PUBLIC_CREATOROS_PRODUCT_FEEDBACK_SUBMIT_ENABLED: "1"
          CREATOROS_CLIENT_CONFIG_PULL_ENABLED: "1"
          CREATOROS_GROWTH_CLIENT_CONFIG_ORIGIN: "https://growth.aitongban.cloud"
          CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64: ${{ secrets.CREATOROS_GROWTH_CONFIG_PUBLIC_KEY_B64 }}
          CREATOROS_GROWTH_CONFIG_KEY_ID: ${{ vars.CREATOROS_GROWTH_CONFIG_KEY_ID }}
          CREATOROS_CREATOR_RELEASE_COMMIT: ${{ github.sha }}
          CREATOROS_GROWTH_RELEASE_COMMIT: ${{ vars.CREATOROS_GROWTH_RELEASE_COMMIT }}
          CREATOROS_ACTIVITY_RELEASE_COMMIT: ${{ vars.CREATOROS_ACTIVITY_RELEASE_COMMIT }}
          CREATOROS_RELEASE: "1"
          CREATOROS_SKIP_SIDECAR_REBUILD: ${{ runner.os == 'Windows' && '1' || '' }}
          CREATOROS_PRODUCTION_CLOSURE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          pnpm desktop:package-channel -- \
            --manifest "branding/packages/${PACKAGE_REF}/package.json" \
            --target "$TARGET" --mode release

      - name: 验证 macOS Developer ID、公证、staple、Gatekeeper 与真实启动
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          manifest="frontend/branding/packages/${PACKAGE_REF}/package.json"
          display_name="$(node -p "require('./$manifest').displayName")"
          binary_name="$(node -p "require('./$manifest').binaryName")"
          app_identifier="$(node -p "require('./$manifest').appIdentifier")"
          app="frontend/src-tauri/target/release/bundle/macos/${display_name}.app"
          dmg="$(find frontend/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -d "$app" && test -f "$dmg"
          jq -e '.codesign.signed == true and .codesign.platform == "darwin" and .notarize.notarized == true' \
            frontend/src-tauri/target/release/bundle/creatoros-release-manifest.json >/dev/null
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$app_identifier"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          mount_dir="$RUNNER_TEMP/channel-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          mounted_app="$mount_dir/${display_name}.app"
          trap 'hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          spctl -a -vv -t exec "$mounted_app"
          launch_app="$RUNNER_TEMP/${display_name}.app"
          ditto "$mounted_app" "$launch_app"
          open "$launch_app"
          executable="$launch_app/Contents/MacOS/$binary_name"
          launched_pid=""
          for _ in $(seq 1 600); do
            launched_pid="$(pgrep -f "$executable" | head -n 1 || true)"
            if [ -n "$launched_pid" ]; then break; fi
            sleep 0.5
          done
          test -n "$launched_pid"
          kill "$launched_pid" >/dev/null 2>&1 || true
          sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          bytes="$(stat -f %z "$dmg")"
          DMG="$dmg" SHA256="$sha256" BYTES="$bytes" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          writeFileSync("channel-package-evidence.json", `${JSON.stringify({
            schema: "creatoros-channel-github-evidence/v1",
            platform: "macos-aarch64",
            packageRef: process.env.PACKAGE_REF,
            commit: process.env.GITHUB_SHA,
            artifact: process.env.DMG,
            sha256: process.env.SHA256,
            bytes: Number(process.env.BYTES),
            developerIdSigned: true,
            notarized: true,
            stapled: true,
            gatekeeperAccepted: true,
            trueLaunch: true,
            published: false,
          }, null, 2)}\n`);
          NODE

      - name: 验证 Windows NSIS 真安装、启动、卸载与未签名边界
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "frontend/branding/packages/$env:PACKAGE_REF/package.json" -Raw | ConvertFrom-Json
          $setup = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "未找到 NSIS setup.exe" }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Windows 当前边界要求如实识别未签名包，实际状态=$($signature.Status)"
          }
          $listing = Join-Path $env:RUNNER_TEMP "channel-nsis-listing.txt"
          & 7z l $setup.FullName | Out-File -Encoding utf8 $listing
          if ((Get-Content $listing -Raw) -notmatch 'sidecar\.tar\.gz') {
            throw "setup.exe 未携带 sidecar.tar.gz"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "$($manifest.binaryName) Package RAT"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList @("/S", "/D=$installDir")
          if ($install.ExitCode -ne 0) { throw "NSIS 静默安装失败(exit=$($install.ExitCode))" }
          $pointer = Join-Path $installDir "runtime-images/runtime-current.txt"
          if (-not (Test-Path $pointer -PathType Leaf)) { throw "安装后缺 runtime-current.txt" }
          $appExe = Join-Path $installDir "$($manifest.binaryName).exe"
          if (-not (Test-Path $appExe -PathType Leaf)) { throw "安装后缺 $($manifest.binaryName).exe" }
          $stdout = Join-Path $env:RUNNER_TEMP "channel.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "channel.stderr.log"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process -FilePath $appExe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          for ($i = 0; $i -lt 1500; $i++) {
            if (Test-Path $stderr) {
              $content = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
              if ($content -match 'MAIN_PAGE_LOAD_FINISHED http://127\.0\.0\.1:') { $ready = $true; break }
            }
            if ($app.HasExited) { break }
            Start-Sleep -Milliseconds 200
          }
          $watch.Stop()
          if (-not $ready) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Windows 渠道包 300 秒内未进入本地主页面"
          }
          if (-not $app.HasExited) {
            $null = $app.CloseMainWindow()
            if (-not $app.WaitForExit(10000)) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }
          $uninstaller = Get-ChildItem $installDir -Recurse -File -Filter "uninstall.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "安装后缺卸载器" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -Wait -PassThru -ArgumentList @("/S")
          if ($uninstall.ExitCode -ne 0) { throw "NSIS 静默卸载失败(exit=$($uninstall.ExitCode))" }
          $sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $evidence = [ordered]@{
            schema = "creatoros-channel-github-evidence/v1"
            platform = "windows-x86_64"
            packageRef = $env:PACKAGE_REF
            commit = $env:GITHUB_SHA
            artifact = $setup.Name
            sha256 = $sha256
            bytes = $setup.Length
            windowsAuthenticode = "unsigned-accepted-risk"
            installed = $true
            trueLaunch = $true
            firstLaunchMilliseconds = $watch.ElapsedMilliseconds
            uninstalled = $true
            published = $false
          }
          $evidence | ConvertTo-Json | Out-File channel-package-evidence.json -Encoding utf8

      - name: 上传 macOS 渠道安装包与证据
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_ref }}-macos-aarch64-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/package-flavors/${{ inputs.package_ref }}/macos-aarch64/attestation.json
            frontend/src-tauri/target/release/bundle/creatoros-release-manifest.json
            frontend/src-tauri/target/release/bundle/creatoros-release-attestation.json
            channel-package-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 上传 Windows 渠道安装包与证据
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_ref }}-windows-x86_64-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/package-flavors/${{ inputs.package_ref }}/windows-x86_64/attestation.json
            frontend/src-tauri/target/release/bundle/creatoros-release-manifest.json
            frontend/src-tauri/target/release/bundle/creatoros-release-attestation.json
            tools/windows-closure-rat/out/package-brand-closure-proof.json
            channel-package-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 清理 macOS 一次性钥匙串
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_CI_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_CI_KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$APPLE_CI_KEYCHAIN_PATH"
          fi
