<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面与图文参考素材目录</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#182833;background:#f5f6f8;--ink:#17394b;--line:#e2e6ea}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;padding:10px 14px;color:inherit}button:hover{border-color:#618ba0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ecb45b;outline-offset:2px}button[aria-pressed=true],button.primary{color:white;background:var(--ink);border-color:var(--ink)}header{padding:25px 36px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:700;letter-spacing:.02em}.brand span{font-size:13px;font-weight:500;color:#677980;margin-left:16px}.badge{font-size:12px;background:#fff4dc;color:#795422;padding:7px 11px;border-radius:20px}.intro{padding:24px 36px 18px}.intro h1{margin:0 0 8px;font-size:26px;font-weight:650}.intro p{margin:0;color:#64747e;font-size:14px;line-height:1.7}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}.workspace{display:grid;grid-template-columns:minmax(400px,1.15fr) minmax(390px,1fr);gap:22px;padding:0 36px 40px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.filters select{padding:9px;border:1px solid var(--line);border-radius:8px;max-width:100%}.counts{font-size:13px;color:#6a7a83;margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{text-align:left;padding:0;overflow:hidden;position:relative}.card[aria-pressed=true]{background:white;color:inherit;outline:2px solid #315e70;outline-offset:2px}.thumb{height:205px;background:#edf0f1;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.card.xhs .thumb{height:125px}.card strong{display:block;padding:11px 10px 5px;font-size:14px}.card small{display:block;padding:0 10px 12px;color:#6d7a80;line-height:1.6;font-size:11px}.dot{position:absolute;top:7px;right:7px;background:#182d3dd9;color:white;border-radius:20px;padding:3px 7px;font-size:10px}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:35px 15px;color:#64747e;text-align:center;line-height:1.8}.detail h2{font-size:20px;margin:0 0 7px}.muted{font-size:12px;line-height:1.7;color:#697b85}.preview{background:#f1f3f4;border-radius:9px;margin:16px 0;display:flex;align-items:center;justify-content:center;min-height:210px;overflow:hidden}.preview img{max-width:100%;width:auto;max-height:400px;object-fit:contain}.download{display:inline-block;text-decoration:none;border:1px solid var(--line);color:inherit;border-radius:8px;padding:9px 12px;font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 120px;gap:12px}.field{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}input,textarea,select{color:#253b48;background:white}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}textarea{min-height:168px;line-height:1.7;resize:vertical;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{font-size:13px}.recipe{background:#f7f8f9;padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.8}.recipe ol{padding-left:21px;margin:5px 0}.note{background:#fff7e8;padding:10px 12px;border-radius:8px;margin-top:12px;font-size:12px;line-height:1.7;color:#765a27}.private{margin-top:18px;font-size:12px;color:#6b7780;display:flex;align-items:center;gap:8px}.private input{width:auto}.notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 18px;color:white;background:#17394b;border-radius:9px;box-shadow:0 4px 20px #17394b22;z-index:5;max-width:90%;font-size:13px}.footer{font-size:12px;color:#73808a;margin:20px 0 0;line-height:1.8}.footer a{color:#315c74}#favorite-kind{max-width:120px}@media(min-width:1500px){.workspace{grid-template-columns:1.2fr 1fr}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1000px){header,.intro{padding:20px}.workspace{padding:0 20px 30px;grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.thumb{height:180px}.detail{position:static}}@media(max-width:600px){header{padding:16px;align-items:flex-start}.brand span{display:block;margin:5px 0 0}.intro{padding:20px 16px}.intro h1{font-size:22px}.workspace{padding:0 16px 25px}.panel{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:190px}.card.xhs .thumb{height:95px}.formgrid{grid-template-columns:1fr}.filters{gap:6px}.filters button{padding:8px 10px}.preview img{max-height:390px}}
</style></head><body>
<header><div class="brand">封面与图文参考素材目录</div><span class="badge">素材研究</span></header>
<section class="intro"><h1>已撤回独立工作区方案</h1><p>系统接入改为现有项目稿面的发布物料、右侧编导与原发布草稿。本页只保留参考素材与本地研究记录，不是CreatorOS的新界面。<a href="integration.md">查看现有系统接入位置</a></p><div class="nav"><button data-library="cover" aria-pressed="true">封面模板库</button><button data-library="xhs" aria-pressed="false">小红书图文模板库</button></div></section>
<main class="workspace"><section class="panel"><div class="filters"><button id="all" aria-pressed="true">模板</button><button id="saved" aria-pressed="false">我的收藏</button><select id="industry" aria-label="选择行业"></select><select id="visual" aria-label="选择画面类型"><option value="all">所有画面类型</option><option value="real_person">真人出镜</option><option value="photo_product">实拍 / 产品</option><option value="graphic">文字 / 图解</option><option value="ai_concept">AI 概念 / 示意</option></select><select id="favorite-kind" aria-label="收藏类型" hidden><option value="all">所有收藏</option><option value="prompt">提示词</option><option value="style">整套风格</option></select></div><p class="counts" id="counts"></p><div class="grid" id="grid"></div><label class="private" id="private-option" hidden><input type="checkbox" id="show-private">查看本机私人真人样例（公共下载包不含）</label><p class="footer">收藏只保存在本浏览器，刷新仍可查看。生产接入将使用真实账号归属。<br><a href="sample-pack.zip" download>下载公共样图与模板配置包</a> · <a href="research.md">查看调研依据</a></p></section>
<aside class="panel detail" id="detail"><p>正在读取真实样图…</p></aside></main><div id="notice" class="notice" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s), storageKey='creatoros-t1021-review-favorites-v1';
let catalog=[],industries=[],privateCatalog=[],state={library:'cover',saved:false,industry:'all',visual:'all',kind:'all',selected:null},favorites=[],timer;
const visualNames={real_person:'真人出镜',photo_product:'实拍 / 产品',graphic:'文字 / 图解',ai_concept:'AI 概念 / 示意'};
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function tell(message){$('#notice').textContent=message;$('#notice').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#notice').hidden=true,4200)}
try{const raw=localStorage.getItem(storageKey);if(raw){const v=JSON.parse(raw);if(Array.isArray(v))favorites=v.filter(x=>x&&typeof x.id==='string'&&typeof x.prompt==='string'&&['cover','xhs'].includes(x.libraryKind))}}catch{tell('无法读取本浏览器收藏；模板仍可使用。')}
function visibleItems(){const source=state.saved?favorites:[...catalog,...($('#show-private').checked?privateCatalog:[])];return source.filter(x=>x.libraryKind===state.library&&(state.industry==='all'||x.industries.includes(state.industry))&&(state.visual==='all'||x.visualMode===state.visual)&&(!state.saved||state.kind==='all'||x.kind===state.kind))}
function render(){const items=visibleItems();if(!items.some(x=>x.id===state.selected))state.selected=items[0]?.id??null;$('#grid').replaceChildren();$('#counts').textContent=`${items.length} 个${state.saved?'收藏':'可查看样例'} · 行业目录共 ${industries.length-1} 类＋通用`;$('#all').setAttribute('aria-pressed',String(!state.saved));$('#saved').setAttribute('aria-pressed',String(state.saved));$('#favorite-kind').hidden=!state.saved;document.querySelectorAll('[data-library]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.library===state.library)));
if(!items.length){$('#grid').append(element('div',state.saved?'这里还没有对应收藏。选择模板后可保存提示词或整套风格。':'此行业或画面类型暂时没有样图。目录保留真实空态，可切换其他分类查看。','empty'));$('#detail').replaceChildren(element('p','请选择一个有样图的模板，或查看已有收藏。'));return}
for(const x of items){const b=element('button',undefined,'card '+(x.libraryKind==='xhs'?'xhs':''));b.setAttribute('aria-pressed',String(x.id===state.selected));b.dataset.templateId=x.id;const thumb=element('div',undefined,'thumb');if(x.preview){const im=element('img');im.src=x.preview;im.alt=x.name;im.loading='lazy';thumb.append(im)}else thumb.append(element('span','已收藏提示词'));b.append(thumb,element('strong',x.name),element('small',x.industries.join(' / ')+' · '+visualNames[x.visualMode]));if(x.private)b.append(element('span','私人','dot'));if(state.saved)b.append(element('span',x.kind==='prompt'?'提示词':'风格','dot'));b.onclick=()=>{state.selected=x.id;render()};$('#grid').append(b)}renderDetail(items.find(x=>x.id===state.selected))}
function renderDetail(x){const d=$('#detail');d.replaceChildren(element('h2',x.name),element('div',x.sampleKind||'私人收藏','muted'));if(x.preview){const p=element('div',undefined,'preview'),im=element('img');im.src=x.preview;im.alt=x.name+'完整预览';p.append(im);d.append(p);const a=element('a',x.libraryKind==='xhs'?'下载风格预览板':'下载封面样图','download');a.href=x.preview;a.download=x.id+'.png';d.append(a)}
const form=element('div',undefined,'formgrid'),nameWrap=element('div'),ratioWrap=element('div');nameWrap.append(element('label','收藏名称','field'));const name=element('input');name.id='template-name';name.value=x.name;name.setAttribute('aria-label','收藏名称');nameWrap.append(name);ratioWrap.append(element('label','生成配置比例','field'));const ratio=element('select');ratio.id='ratio';ratio.setAttribute('aria-label','生成配置比例');for(const v of ['3:4','4:3','16:9','9:16','1:1']){const o=element('option',v);o.value=v;ratio.append(o)}ratio.value=x.aspectRatio;ratio.style.cssText='width:100%;padding:10px;border:1px solid #e2e6ea;border-radius:8px';ratioWrap.append(ratio);form.append(nameWrap,ratioWrap);d.append(form,element('label','可编辑提示词','field'));const prompt=element('textarea');prompt.id='prompt';prompt.value=x.prompt;prompt.setAttribute('aria-label','可编辑提示词');d.append(prompt);
if(x.pageRecipes?.length){const p=element('div',undefined,'recipe'),ol=element('ol');p.append(element('strong','图文页职责'));x.pageRecipes.forEach(t=>ol.append(element('li',t)));p.append(ol);d.append(p)}
const actions=element('div',undefined,'actions');for(const [label,action,cls] of [['收藏提示词',()=>save(x,'prompt'),'primary'],...(x.preview?[['收藏整套风格',()=>save(x,'style'),'']]:[]),['下载生成配置',()=>downloadConfig(x),''],...(state.saved?[['删除此收藏',()=>remove(x),'']]:[])]){const b=element('button',label,cls);b.onclick=action;actions.append(b)}d.append(actions);
d.append(element('div',x.libraryKind==='xhs'?'这是三页风格预览板，不是可上传的三张独立正文图片。图中产品、体验、时间与地点属于示例；生成时换成真实内容。':'样图展示风格。修改比例与提示词只影响导出的生成配置，不会重新生成或裁切当前图片。','note'));
if(x.visualMode==='real_person')d.append(element('div','真人模板必须上传用户本人身份照片。此处仅查看本机私人候选，不向公共模板包分发人物图片。','note'));d.append(element('p','本预览可筛选、编辑、收藏与下载。模型生成和项目采纳将在正式接入后绑定现有任务链。','muted'))}
function edited(x){return {...x,name:$('#template-name').value.trim(),prompt:$('#prompt').value.trim(),aspectRatio:$('#ratio').value}}
function save(x,kind){const value=edited(x);if(!value.name||!value.prompt){tell('名称和提示词不能为空。');return}const record={...value,id:crypto.randomUUID(),kind,sourceTemplateId:x.sourceTemplateId||x.id,preview:kind==='style'?x.preview:null,savedAt:new Date().toISOString()};const next=[record,...favorites];try{localStorage.setItem(storageKey,JSON.stringify(next));favorites=next;tell('已保存'+(kind==='prompt'?'提示词':'整套风格')+'，可在「我的收藏」查看。')}catch{tell('浏览器未能保存收藏；请下载生成配置。')}}
function remove(x){const next=favorites.filter(v=>v.id!==x.id);try{localStorage.setItem(storageKey,JSON.stringify(next));favorites=next;render();tell('已删除此收藏，原样图仍然保留。')}catch{tell('未能删除收藏，请重试。')}}
function downloadConfig(x){const v=edited(x);if(!v.name||!v.prompt){tell('名称和提示词不能为空。');return}const payload={schema:'creatoros.visual-template-preview/v1',notice:'仅生成配置，未提交模型或写入CreatorOS',libraryKind:v.libraryKind,name:v.name,industries:v.industries,visualMode:v.visualMode,aspectRatio:v.aspectRatio,prompt:v.prompt,requiredInputs:v.requiredInputs,pageRecipes:v.pageRecipes,sourceTemplateId:v.sourceTemplateId||v.id,private:v.private,sampleIsPreviewBoard:v.libraryKind==='xhs'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=element('a');a.href=url;a.download='template-'+v.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);tell('已下载当前编辑后的生成配置。')}
document.querySelectorAll('[data-library]').forEach(b=>b.onclick=()=>{state.library=b.dataset.library;state.selected=null;render()});$('#all').onclick=()=>{state.saved=false;render()};$('#saved').onclick=()=>{state.saved=true;render()};$('#industry').onchange=e=>{state.industry=e.target.value;render()};$('#visual').onchange=e=>{state.visual=e.target.value;render()};$('#favorite-kind').onchange=e=>{state.kind=e.target.value;render()};$('#show-private').onchange=()=>render();
(async()=>{try{const r=await fetch('templates.json');if(!r.ok)throw Error('目录读取失败');const data=await r.json();catalog=data.templates;industries=data.industries;$('#industry').append(new Option('所有行业','all'));industries.forEach(t=>$('#industry').append(new Option(t,t)));try{const p=await fetch('private/templates.json');if(p.ok){privateCatalog=(await p.json()).templates;$('#private-option').hidden=false}}catch{}render()}catch{$('#detail').textContent='目录读取失败。请通过本地HTTP预览打开，不要直接以file协议打开。';tell('样图目录读取失败。')}})();
</script></body></html>
