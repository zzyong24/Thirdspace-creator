[package]
name = "creatoros-workbench-test"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "../workbench/mod.rs"

[features]
workbench-browser = []

[dependencies]
url = "2"
libc = "0.2"
rand = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
nomi-browser = { path = "../workbench/vendor/nomifun/crates/agent/nomi-browser" }
nomi-browser-engine = { path = "../workbench/vendor/nomifun/crates/agent/nomi-browser-engine" }
nomifun-browser-platform = { path = "../workbench/vendor/nomifun/crates/backend/nomifun-browser-platform" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
